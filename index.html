<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>책계부</title>
<meta name="description" content="읽은 책, 독서록, 진척도, 마음에 남은 문장을 기록하는 개인 책계부">
<meta name="theme-color" content="#f3ece0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c0673a' stroke-width='2' stroke-linejoin='round'%3E%3Cpath d='M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z'/%3E%3Cpath d='M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* ===== 색과 글꼴 (여기 값만 바꾸면 전체 톤이 바뀌어요) ===== */
:root{
  --bg:#f8f3ea; --card:#fffdf8; --subtle:#f3ece0; --muted:#efe7da;
  --border:#e6dccb; --bs:#dccfb9; --be:#b9a68c;
  --fg:#2b2520; --fm:#5f5346; --fs:#76695b;
  --acc:#c0673a; --acc2:#8a4322; --acc-soft:#efcfae;
  --ink:#2b2520; --ink-fg:#fffdf8;
  --hero:#3a2e25; --hero-fg:#fffdf8; --hero-sub:#efcfae; --hero-mute:#d9cbb8;
  --ok:#5f8a4e; --danger:#a5402a;
  --h0:#efe7da; --h1:#efcfae; --h2:#dea075; --h3:#c0673a; --h4:#8a4322;
  --shadow:0 12px 32px rgba(43,37,32,.18); --overlay:rgba(43,37,32,.42);
  --sans:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1c1814; --card:#241f1a; --subtle:#2a241e; --muted:#332c25;
  --border:#3a322a; --bs:#4a3f34; --be:#6e5f4f;
  --fg:#f3ebe0; --fm:#cdbda9; --fs:#a8977f;
  --acc:#e08a5c; --acc2:#f0b48f; --acc-soft:#5a3a26;
  --ink:#f3ebe0; --ink-fg:#1c1814;
  --hero:#2e2620; --hero-fg:#f3ebe0; --hero-sub:#e8a07a; --hero-mute:#bfae98;
  --ok:#8fbf7a; --danger:#e48a72;
  --h0:#2a241e; --h1:#5a3a26; --h2:#8a5232; --h3:#c0673a; --h4:#e8a07a;
  --shadow:0 12px 32px rgba(0,0,0,.55); --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.muted{color:var(--fm)} .subtle{color:var(--fs)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.spacer{flex:1}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}

/* buttons & form */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--bs);border-radius:var(--r);background:var(--subtle);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s}
.btn:hover{background:var(--muted);border-color:var(--be)}
.btn-primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn-primary:hover{background:var(--ink);border-color:var(--ink);opacity:.88}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--muted);border-color:transparent}
.btn-danger{color:var(--danger)}
.btn-danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-icon{width:34px;padding:0}
.btn-sm.btn-icon{width:28px}
.btn-lg{height:46px;font-size:15px;font-weight:700;border-radius:8px}
.counter{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 6px;border-radius:999px;background:var(--muted);border:1px solid var(--border);font-family:var(--mono);font-size:11px;font-weight:600;line-height:1}
.label{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border:1px solid var(--bs);border-radius:999px;font-size:11px;font-weight:500;color:var(--fm);white-space:nowrap}
.label.on{border-color:var(--fg);color:var(--fg);font-weight:700}
.label.done{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.label.want{border-style:dashed}
.input,.select,.textarea{height:34px;padding:0 10px;border:1px solid var(--bs);border-radius:var(--r);background:var(--card);font-size:13px;min-width:0}
.textarea{height:auto;padding:10px;resize:vertical;line-height:1.65;width:100%}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.flabel{font-size:12px;color:var(--fm)}
.seg{display:inline-flex;border:1px solid var(--bs);border-radius:var(--r);overflow:hidden;background:var(--subtle);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;height:30px;padding:0 11px;font-size:12px;cursor:pointer;color:var(--fm);border-right:1px solid var(--bs);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:700;box-shadow:inset 0 -2px 0 var(--fg)}
.seg.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
.seg.full button{height:40px;font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--muted);overflow:hidden;border:1px solid var(--border)}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:3px}
.box{border:1px solid var(--bs);border-radius:var(--r);background:var(--card)}
.box-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--subtle);border-bottom:1px solid var(--bs);border-radius:var(--r) var(--r) 0 0;font-size:13px}
.box-h h2,.box-h h3{margin:0;font-size:13px;font-weight:700}
.box-b{padding:16px}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--bs);background:var(--card);color:var(--fm);font-size:12px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ink-fg);font-weight:700}
.chip.lg{height:36px;font-size:13px;padding:0 14px}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:var(--subtle);border-bottom:1px solid var(--bs);padding-top:env(safe-area-inset-top)}
.hdr-in{display:flex;align-items:center;gap:8px;height:56px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;text-decoration:none}
.brand svg{width:20px;height:20px;stroke:var(--acc)}
.crumb{color:var(--fs);font-size:18px;font-weight:300}
.sync-ind{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fm);text-decoration:none;padding:4px 8px;border-radius:999px}
.sync-ind:hover{background:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--be);flex:none}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--acc);animation:pulse 1s infinite} .dot.err{background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}
.tabnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabnav::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:8px 10px 10px;font-size:13px;color:var(--fm);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg);font-weight:700;border-bottom-color:var(--fg)}
@media (max-width:640px){.hide-sm{display:none!important}}

/* main */
main{padding-top:24px;padding-bottom:64px;display:flex;flex-direction:column;gap:24px}
.page-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-h h1{margin:0;font-size:20px}
.sec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{border:1px solid var(--bs);border-radius:var(--r);background:var(--card);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.stat .k{font-size:12px;color:var(--fm)}
.stat .v{display:flex;align-items:baseline;gap:6px}
.stat .v b{font-family:var(--mono);font-size:28px;line-height:1.1}
.stat .v span{font-family:var(--mono);font-size:12px;color:var(--fm)}
.stat .s{font-size:11px;color:var(--fs)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.bcard{display:flex;gap:14px;padding:14px;border:1px solid var(--bs);border-radius:var(--r);background:var(--card);text-decoration:none;color:var(--fg);transition:border-color .12s,transform .12s}
.bcard:hover{border-color:var(--be);transform:translateY(-1px)}
.cover{flex:none;width:64px;height:92px;border-radius:3px 7px 7px 3px;display:flex;flex-direction:column;justify-content:flex-end;padding:7px;box-shadow:inset 4px 0 0 rgba(0,0,0,.14);border:1px solid rgba(0,0,0,.12);overflow:hidden}
.cover b{font-family:var(--serif);font-size:11px;line-height:1.25;word-break:keep-all}
.cover.lg{width:120px;height:172px;padding:12px}
.cover.lg b{font-size:16px}
.cover.lg small{font-size:10px;opacity:.75}
.bcard .t{font-family:var(--serif);font-weight:700;font-size:15px;line-height:1.35}
.bcard .a{font-size:12px;color:var(--fm)}
.prog{display:flex;align-items:center;gap:8px}
.prog .bar{flex:1}
.prog b{font-family:var(--mono);font-size:12px;width:38px;text-align:right}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--fm);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--muted);vertical-align:middle}
tr:last-child td{border-bottom:0}
td a.tt{font-weight:700;text-decoration:none;font-family:var(--serif)}
td a.tt:hover{text-decoration:underline}
.stars{font-family:var(--mono);letter-spacing:1px;color:var(--acc);white-space:nowrap}

/* book detail */
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.col{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:16px}
.col.wide{flex-basis:420px}
.bhead{display:flex;gap:18px}
.bhead h1{margin:0;font-family:var(--serif);font-size:26px;line-height:1.3}
.blocks{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.blocks span{height:14px;border-radius:2px;background:var(--muted);border:1px solid var(--border)}
.blocks span.f{background:var(--acc);border-color:var(--acc)}
.blocks.sm{gap:2px}.blocks.sm span{height:10px;border:0}
.big{font-family:var(--mono);font-size:38px;font-weight:700;line-height:1}
.logrow{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--muted);font-size:13px}
.logrow:last-child{border-bottom:0}
.starbtn{width:34px;height:34px;border:0;background:none;font-size:22px;line-height:1;color:var(--be);cursor:pointer;padding:0}
.starbtn.on{color:var(--acc)}
.qrow{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--muted);align-items:flex-start}
.qrow:last-child{border-bottom:0}
.qrow p{margin:0;flex:1;font-family:var(--serif);font-size:15px;line-height:1.75;white-space:pre-wrap}

/* heatmap & charts */
.heat-wrap{overflow-x:auto;padding-bottom:4px}
.heat{display:flex;gap:6px;width:max-content}
.heat-days{display:grid;grid-template-rows:repeat(7,11px);gap:3px;font-size:9px;color:var(--fs);padding-top:17px;line-height:11px}
.heat-months{display:grid;grid-auto-columns:11px;column-gap:3px;height:14px;font-size:10px;color:var(--fs);font-family:var(--mono);white-space:nowrap}
.heat-grid{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px}
.heat-grid span{border-radius:2px;background:var(--h0)}
.heat-grid span.l1{background:var(--h1)}.heat-grid span.l2{background:var(--h2)}.heat-grid span.l3{background:var(--h3)}.heat-grid span.l4{background:var(--h4)}
.heat-grid span.fut{background:transparent;border:1px solid var(--muted)}
.heat-grid span.pad{background:transparent}
.heat-grid span.today{outline:1.5px solid var(--fg);outline-offset:0}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;font-size:11px;color:var(--fs)}
.legend i{width:11px;height:11px;border-radius:2px}
.mchart{position:relative;height:170px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:end;border-bottom:1px solid var(--bs)}
.mchart .goal{position:absolute;left:0;right:0;border-top:1px dashed var(--be);pointer-events:none}
.mchart .goal span{position:absolute;right:0;top:-16px;font-size:10px;font-family:var(--mono);color:var(--fs)}
.mcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.mcol i{display:block;width:100%;max-width:28px;background:var(--h2);border-radius:3px 3px 0 0;min-height:2px}
.mcol i.cur{background:var(--acc)} .mcol i.hit{background:var(--h4)} .mcol i.zero{background:var(--muted)}
.mcol span{font-size:10px;font-family:var(--mono);color:var(--fm)}
.mlabels{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;text-align:center;font-size:10px;color:var(--fs);font-family:var(--mono);margin-top:6px}
.goalgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.goalgrid span{aspect-ratio:2/3;border-radius:2px 5px 5px 2px;border:1px dashed var(--bs);background:var(--card)}
.goalgrid span.d{background:var(--acc);border:1px solid var(--acc)}
.goalgrid span.r{background:linear-gradient(0deg,var(--acc-soft) 50%,var(--card) 50%);border:1px solid var(--h2)}
.prow{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--muted);flex-wrap:wrap;text-decoration:none}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--subtle)}
.prow .t{width:170px;font-family:var(--serif);font-weight:700}
.prow .blocks{flex:1 1 220px}

/* quotes */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:10px;padding:28px 32px;display:flex;flex-direction:column;gap:14px}
.hero .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--hero-sub)}
.hero p{margin:0;font-family:var(--serif);font-size:clamp(19px,3.2vw,26px);line-height:1.6;font-weight:500;max-width:860px;white-space:pre-wrap}
.hero .src{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--hero-mute)}
.hero .btn{background:transparent;color:var(--hero-fg);border-color:rgba(255,255,255,.25)}
.hero .btn:hover{background:rgba(255,255,255,.08)}
.qtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.masonry{columns:3 290px;column-gap:14px}
.qcard{break-inside:avoid;margin:0 0 14px;border:1px solid var(--bs);border-radius:var(--r);background:var(--card);padding:16px;display:flex;flex-direction:column;gap:10px}
.qcard p{margin:0;font-family:var(--serif);font-size:16px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.qcard .src{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.qcard .src a,.qcard .src b{font-weight:700;text-decoration:none}
.qcard .act{display:flex;align-items:center;gap:2px;border-top:1px solid var(--muted);padding-top:8px}
.qcard .fav{color:var(--acc)}
.icon-btn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:none;color:var(--fm);cursor:pointer}
.icon-btn:hover{background:var(--muted);color:var(--fg)}
.icon-btn.on{color:var(--acc)}
.icon-btn.on svg{fill:currentColor}

/* misc */
.empty{border:1px dashed var(--bs);border-radius:10px;padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--card)}
.empty h2{margin:0;font-family:var(--serif);font-size:20px}
.empty p{margin:0;color:var(--fm);max-width:420px}
.note{font-size:12px;color:var(--fs)}
.steps{margin:0;padding:0 0 0 20px;display:flex;flex-direction:column;gap:12px;font-size:13px;line-height:1.65}
pre.code{margin:0;padding:12px;background:var(--subtle);border:1px solid var(--border);border-radius:var(--r);font-family:var(--mono);font-size:11.5px;line-height:1.6;overflow-x:auto;white-space:pre}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dates{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 10px;border:1px solid var(--bs);border-radius:999px;background:var(--card);font-size:12px;color:var(--fm)}
.dchip input{border:0;background:transparent;font-family:var(--mono);font-size:12px;color:var(--fg);height:28px;padding:0 6px 0 0;min-width:0}
.dchip input:focus{outline:none}
.dchip:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.bhead h1,.bhead .muted,.crumbs span,.bcard .t,.bcard .a,td,.prow .t,.qrow p,.hero p,.hero .src,.qcard .src,.qcard p,.dlg-h h2,.cover b,.empty p{overflow-wrap:anywhere;word-break:break-word}
.label,.chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip{max-width:min(240px,100%)}
.crumbs span:last-child{min-width:0}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fm)}
.crumbs a,.crumbs .subtle{flex:none;white-space:nowrap}
.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}

/* dialog */
dialog{border:1px solid var(--bs);border-radius:12px;padding:0;background:var(--card);color:var(--fg);width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:var(--overlay)}
.dlg{display:flex;flex-direction:column;gap:14px;padding:12px 18px 20px}
.dlg-h{display:flex;align-items:center;gap:8px}
.dlg-h h2{margin:0;font-size:16px}
.grab{display:none;width:40px;height:4px;border-radius:2px;background:var(--bs);align-self:center}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .btn{width:46px;height:46px;font-size:18px;padding:0}
.stepper input{flex:1;height:46px;text-align:center;font-family:var(--mono);font-size:22px;font-weight:700;border:1px solid var(--fg);border-radius:var(--r);background:var(--card);min-width:0}
@media (max-width:600px){
  dialog#dlg{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:16px 16px 0 0;border-bottom:0;max-height:92dvh}
  .dlg{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .grab{display:block}
  .hero{padding:22px 20px}
  .prow .t{width:100%}
  .bhead .cover.lg{width:88px;height:126px}
}

create table if not exists public.ledger (

/* ---------- 동기화 병합 (3방향) ----------
   base  = 마지막으로 서버와 맞춘 상태
   local = 이 기기, remote = 서버
   항목의 칸(필드)마다: 한쪽만 바꿨으면 그쪽, 둘 다 바꿨으면
   - 메모·한줄평·문장: 두 내용을 모두 남겨요

const LS_BASE = 'bookledger.base';
const TEXT_FIELDS = new Set(['memo', 'oneLine', 'text']);
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

}
function merge3Item(l, r, b, conflicts, label) {
  if (!l) return r; if (!r) return l;
  const newerR = (r.updatedAt || '') > (l.updatedAt || '');
  if (!b) return newerR ? Object.assign({}, l, r) : Object.assign({}, r, l);

  for (const k of new Set([...Object.keys(l), ...Object.keys(r)])) {

    else if (rc && !lc) out[k] = r[k];
    else if (!lc && !rc) out[k] = l[k];
    else if (same(l[k], r[k])) out[k] = l[k];

  const monthDays = [...days].filter(d => d.startsWith(mon)).length;
  const st = streakOf(days), best = longestStreak(days);
  const qs = live(S.quotes), weekAgo = addDays(new Date(), -7).toISOString();
  const qWeek = qs.filter(q => q.createdAt > weekAgo).length;
  const g = S.settings.goal || 24, mg = S.settings.monthGoal || 15;
  const stat = (k, v, unit, pct, s) => `<div class="stat"><div class="k">${k}</div><div class="v"><b>${v}</b><span>${unit}</span></div><div class="bar"><i style="width:${clamp(pct, 0, 100)}%"></i></div><div class="s">${s}</div></div>`;
  const reading = bs.filter(b => b.status === 'reading').sort((a, b) => (b.lastReadAt || b.updatedAt || '').localeCompare(a.lastReadAt || a.updatedAt || ''));

  const cnt = { all: bs.length, reading: reading.length, done: bs.filter(b => b.status === 'done').length, want: bs.filter(b => b.status === 'want').length };
  let list = U.libFilter === 'all' ? bs.slice() : bs.filter(b => b.status === U.libFilter);
  const q = U.libQ.trim().toLowerCase();
  if (q) list = list.filter(b => (b.title + ' ' + (b.author || '') + ' ' + (b.tags || []).join(' ')).toLowerCase().includes(q));
  const sorters = {
    recent: (a, b) => (b.lastReadAt || b.updatedAt || '').localeCompare(a.lastReadAt || a.updatedAt || ''),
    title: (a, b) => a.title.localeCompare(b.title, 'ko'),
    rating: (a, b) => (b.rating || 0) - (a.rating || 0),
    progress: (a, b) => (b.progress || 0) - (a.progress || 0)
  };
  list.sort(sorters[U.libSort] || sorters.recent);
  const qCount = id => live(S.quotes).filter(x => x.bookId === id).length;
  const seg = (v, t) => `<button data-act="libFilter" data-v="${v}" aria-pressed="${U.libFilter === v}">${t} ${cnt[v]}</button>`;

  return `${sampleBanner()}
  <div class="stats">
    ${stat('올해 완독', doneY, `/ ${g}권`, doneY / g * 100, `연간 목표 ${g}권 · 이번 달 ${doneM}권`)}
    ${stat('이번 달 독서일', monthDays, '일', monthDays / mg * 100, `월 목표 ${mg}일`)}
    ${stat('연속 독서일', st, '일', best ? st / best * 100 : 0, `최장 기록 ${best}일`)}
    ${stat('모은 문장', qs.length, '개', qs.length ? 100 : 0, `이번 주 +${qWeek}`)}
  </div>
  <section style="display:flex;flex-direction:column;gap:12px">
    <div class="sec-h"><h2>지금 읽는 중</h2><span class="counter">${reading.length}</span><div class="spacer"></div><span class="note hide-sm">카드를 눌러 오늘 진척 기록</span></div>
    ${reading.length ? `<div class="cards">${reading.map(b => `
      <a class="bcard" href="#book/${encodeURIComponent(b.id)}">
        ${coverHTML(b)}
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
          <div class="t">${esc(b.title)}</div><div class="a">${esc(b.author || '')}</div>
          <div class="spacer"></div>
          <div class="prog"><div class="bar"><i style="width:${b.progress || 0}%"></i></div><b>${b.progress || 0}%</b></div>
          <div class="note">마지막 기록 ${relDay(b.lastReadAt)}</div>
        </div>
      </a>`).join('')}</div>` : `<div class="note">읽는 중인 책이 없어요. 아래 목록에서 책을 골라 '읽는 중'으로 바꿔보세요.</div>`}
  </section>
  <section class="box">
    <div class="box-h">
      <h2>전체 책</h2>
      <div class="seg" role="group" aria-label="상태로 거르기">${seg('all', '전체')}${seg('reading', '읽는 중')}${seg('done', '완독')}${seg('want', '읽고 싶은')}</div>
      <div class="spacer"></div>
      <label class="sr" for="libQ">책 검색</label>
      <input id="libQ" class="input" placeholder="제목·저자·태그 검색" value="${esc(U.libQ)}" style="width:180px;height:30px">
      <label class="sr" for="libSort">정렬</label>
      <select id="libSort" class="select" style="height:30px">
        ${[['recent', '최근 기록순'], ['title', '제목순'], ['rating', '평점순'], ['progress', '진척순']].map(([v, t]) => `<option value="${v}"${U.libSort === v ? ' selected' : ''}>${t}</option>`).join('')}
      </select>
      <button class="btn btn-sm btn-primary" data-act="addBook">${ICON.plus}책 추가</button>
    </div>
    <div class="tbl-wrap"><table style="min-width:760px">
      <thead><tr><th>제목</th><th>상태</th><th style="width:190px">진척도</th><th>평점</th><th>한 줄 독서록</th><th>문장</th></tr></thead>
      <tbody>${list.map(b => `<tr>
        <td><a class="tt" href="#book/${encodeURIComponent(b.id)}">${esc(b.title)}</a><div class="note">${esc(b.author || '')}</div></td>
        <td>${statusLabel(b.status)}</td>
        <td><div class="prog"><div class="bar"><i style="width:${b.progress || 0}%"></i></div><b>${b.progress || 0}%</b></div></td>
        <td class="stars">${starsText(b.rating)}</td>
        <td class="muted" style="max-width:320px">${esc(b.oneLine || '')}</td>
        <td class="mono muted">${qCount(b.id)}</td>
      </tr>`).join('') || `<tr><td colspan="6" class="note" style="padding:24px 14px">조건에 맞는 책이 없어요.</td></tr>`}</tbody>
    </table></div>
  </section>
  <p class="note" style="margin:0">기록은 이 브라우저에 저장돼요. 다른 기기와 같이 보려면 <a href="#sync">동기화</a>를 켜거나 백업 파일을 내려받아 두세요.</p>`;
}

  const dateLine = `<div class="dates">
      <label class="dchip"><span>시작</span><input type="date" data-date="startedAt" value="${b.startedAt || ''}" max="${ymd()}" aria-label="읽기 시작한 날"></label>

          <div class="row" style="gap:4px;margin-top:2px">
            <button class="btn btn-sm btn-ghost" data-act="editBook">${ICON.edit}수정</button>
            <button class="btn btn-sm btn-ghost btn-danger" data-act="delBook">${ICON.trash}삭제</button>

      <section class="box">
        <div class="box-h"><h2>진척도</h2><div class="spacer"></div><span class="mono muted" style="font-size:12px">${p >= 100 ? '다 읽었어요' : `남은 ${100 - p}%${eta ? ` · 이 속도면 약 ${eta}일` : ''}`}</span></div>
        <div class="box-b" style="display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;align-items:baseline;gap:10px"><span class="big">${p}%</span><span class="muted" style="font-size:13px">${todayLine}</span></div>

          <div class="row" style="align-items:flex-end">
            <div class="field"><label for="pctIn">지금 몇 %쯤 읽었나요?</label>

            <button class="btn" data-act="addPct" data-v="100">완독</button>
          </div>

          ${logs.length ? logs.slice(0, 12).map(l => `<div class="logrow"><span class="mono muted" style="width:70px;font-size:12px">${md(l.date)}</span><span class="mono" style="flex:1">${l.from}% → ${l.to}%</span><span class="mono" style="font-weight:700;color:var(--acc)">${l.to - l.from >= 0 ? '+' : ''}${l.to - l.from}%</span></div>`).join('')

          <div class="row" style="gap:10px"><span class="flabel">평점</span>
            <div style="display:flex">${[1, 2, 3, 4, 5].map(n => `<button class="starbtn${(b.rating || 0) >= n ? ' on' : ''}" data-act="rate" data-v="${n}" aria-label="${n}점">${(b.rating || 0) >= n ? '★' : '☆'}</button>`).join('')}</div>
            <span class="note">같은 별을 한 번 더 누르면 지워져요</span></div>

      <section class="box">
        <div class="box-h"><h2>이 책의 문장</h2><span class="counter">${qs.length}</span><div class="spacer"></div><a href="#quotes" style="font-size:12px" data-act="qFilterGo" data-v="${esc(b.id)}">아카이브에서 보기</a></div>

          : `<div class="qrow note">아직 모은 문장이 없어요.</div>`}

function vProgress() {
  const amounts = dayAmounts();
  const years = new Set([new Date().getFullYear(), ...[...amounts.keys()].map(d => +d.slice(0, 4))]);
  const ys = [...years].sort();
  const Y = U.year, start = new Date(Y, 0, 1), off = start.getDay();
  const nDays = (new Date(Y + 1, 0, 1) - start) / 864e5 | 0, today = ymd();
  const cells = []; for (let i = 0; i < off; i++) cells.push('<span class="pad"></span>');
  let yDays = 0; const yDates = new Set();
  for (let i = 0; i < nDays; i++) {
    const d = ymd(addDays(start, i)), a = amounts.get(d) || 0;
    if (a) { yDays++; yDates.add(d); }
    const lv = !a ? 0 : a <= 5 ? 1 : a <= 10 ? 2 : a <= 20 ? 3 : 4;
    const cls = d > today ? 'fut' : (lv ? 'l' + lv : '') + (d === today ? ' today' : '');
    cells.push(`<span class="${cls}" title="${dot(d)}${a ? ` · +${a}%` : ''}"></span>`);
  }
  const cols = Math.ceil(cells.length / 7);
  const mLabels = Array.from({ length: 12 }, (_, m) => { const di = (new Date(Y, m, 1) - start) / 864e5 | 0; return `<span style="grid-column:${Math.floor((off + di) / 7) + 1}">${m + 1}월</span>`; }).join('');

  const mg = S.settings.monthGoal || 15;
  const mDays = Array.from({ length: 12 }, (_, m) => [...yDates].filter(d => +d.slice(5, 7) === m + 1).length);
  const maxV = Math.max(mg, ...mDays) || 1, curM = Y === new Date().getFullYear() ? new Date().getMonth() : -1;
  const H = 140;
  const bs = allBooks(), g = S.settings.goal || 24;
  const doneY = bs.filter(b => b.status === 'done' && (b.finishedAt || '').startsWith(String(Y)));
  const readingN = Y === new Date().getFullYear() ? bs.filter(b => b.status === 'reading').length : 0;
  const slots = Math.max(g, doneY.length + readingN);
  const goalCells = Array.from({ length: slots }, (_, i) => `<span class="${i < doneY.length ? 'd' : i < doneY.length + readingN ? 'r' : ''}"></span>`).join('');
  const prog = bs.filter(b => b.status === 'reading' || (b.status === 'done' && (b.finishedAt || '').startsWith(String(Y))))
    .sort((a, b) => (a.status === b.status ? (b.progress || 0) - (a.progress || 0) : a.status === 'reading' ? -1 : 1));

  return `
  <div class="page-h"><h1>진척도</h1><div class="spacer"></div>
    <div class="seg" role="group" aria-label="연도">${ys.map(y => `<button data-act="year" data-v="${y}" aria-pressed="${y === Y}">${y}</button>`).join('')}</div></div>
  <section class="box">
    <div class="box-h"><h2>독서 잔디</h2><span class="mono muted" style="font-size:12px">${Y}년 ${yDays}일 읽음 · 최장 연속 ${longestStreak(yDates)}일</span></div>
    <div class="box-b">
      <div class="heat-wrap"><div class="heat">
        <div class="heat-days"><span></span><span>월</span><span></span><span>수</span><span></span><span>금</span><span></span></div>
        <div style="display:flex;flex-direction:column;gap:3px">
          <div class="heat-months" style="grid-template-columns:repeat(${cols},11px)">${mLabels}</div>
          <div class="heat-grid" role="img" aria-label="${Y}년 날짜별 독서량">${cells.join('')}</div>
        </div>
      </div></div>
      <div class="legend"><span>적게</span><i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i><span>많이</span></div>
    </div>
  </section>
  <div class="cols">
    <section class="box" style="flex:2 1 460px;min-width:0">
      <div class="box-h"><h2>월별 독서일</h2><div class="spacer"></div>
        <label class="note" for="monthGoal">월 목표</label><input id="monthGoal" class="input mono" type="number" min="1" max="31" value="${mg}" style="width:64px;height:28px"><span class="note">일</span></div>
      <div class="box-b" style="padding-top:26px">
        <div class="mchart" style="height:${H + 30}px">
          <div class="goal" style="bottom:${Math.round(mg / maxV * H)}px"><span>목표 ${mg}일</span></div>
          ${mDays.map((v, i) => `<div class="mcol"><span>${v || ''}</span><i class="${i === curM ? 'cur' : !v ? 'zero' : v >= mg ? 'hit' : ''}" style="height:${Math.round(v / maxV * H)}px"></i></div>`).join('')}
        </div>
        <div class="mlabels">${Array.from({ length: 12 }, (_, i) => `<span>${i + 1}</span>`).join('')}</div>
      </div>
    </section>
    <section class="box" style="flex:1 1 280px;min-width:0">
      <div class="box-h"><h2>연간 목표</h2><div class="spacer"></div>
        <label class="note" for="goal">목표</label><input id="goal" class="input mono" type="number" min="1" max="365" value="${g}" style="width:64px;height:28px"><span class="note">권</span></div>
      <div class="box-b" style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:baseline;gap:6px"><span class="big" style="font-size:32px">${doneY.length}</span><span class="mono muted">/ ${g}권 완독</span></div>
        <div class="goalgrid">${goalCells}</div>
        <div class="note">책 한 권 = 한 칸. 지금 읽는 책은 반만 칠해져요.</div>
      </div>
    </section>
  </div>
  <section class="box">
    <div class="box-h"><h2>책별 진척</h2></div>
    ${prog.length ? prog.map(b => { const e = etaDays(b); return `<a class="prow" href="#book/${encodeURIComponent(b.id)}">
      <span class="t">${esc(b.title)}</span>${blocksHTML(b.progress || 0, true)}
      <b class="mono" style="width:48px;text-align:right">${b.progress || 0}%</b>
      <span class="note" style="width:120px;text-align:right">${b.status === 'done' ? `${md(b.finishedAt)} 완독` : e ? `약 ${e}일 후 완독` : '기록을 더 쌓아주세요'}</span></a>`; }).join('')
      : `<div class="prow note">읽는 중이거나 올해 다 읽은 책이 여기에 보여요.</div>`}
  </section>`;
}

function vQuotes() {
  const qs = live(S.quotes).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  if (!qs.length) return `<div class="page-h"><h1>문장 아카이브</h1></div>
    <div class="empty"><h2>모은 문장이 아직 없어요</h2><p>책에서 밑줄 긋고 싶었던 문장, 문득 떠오른 생각을 한 줄씩 모아보세요.</p>
    <button class="btn btn-primary" data-act="newQuote">${ICON.plus}문장 추가</button></div>`;
  let hero = qs.find(q => q.id === U.randomQ);
  if (!hero) { let h = 0; for (const c of ymd()) h = (h * 33 + c.charCodeAt(0)) >>> 0; hero = qs[h % qs.length]; }
  U.heroId = hero.id;
  const srcIds = [...new Set(qs.map(q => q.bookId || '__me'))];
  const chips = [['all', '전체'], ['fav', '★ 즐겨찾기'], ...srcIds.filter(i => i !== '__me').map(i => [i, getBook(i)?.title || qs.find(q => q.bookId === i)?.bookTitle || '지운 책']), ...(srcIds.includes('__me') ? [['__me', '내 생각']] : [])];
  if (!chips.some(([v]) => v === U.qFilter)) U.qFilter = 'all';
  let list = qs;
  if (U.qFilter === 'fav') list = list.filter(q => q.fav);
  else if (U.qFilter === '__me') list = list.filter(q => !q.bookId);
  else if (U.qFilter !== 'all') list = list.filter(q => q.bookId === U.qFilter);
  const s = U.qQ.trim().toLowerCase();
  if (s) list = list.filter(q => (q.text + ' ' + quoteSrc(q) + ' ' + (q.tag || '')).toLowerCase().includes(s));
  const src = q => q.bookId && getBook(q.bookId) ? `<a href="#book/${encodeURIComponent(q.bookId)}">${esc(quoteSrc(q))}</a>` : `<b>${esc(quoteSrc(q))}</b>`;
  return `
  <div class="page-h"><h1>문장 아카이브</h1><span class="counter">${qs.length}</span><div class="spacer"></div>
    <button class="btn btn-primary" data-act="newQuote">${ICON.plus}문장 추가</button></div>
  <section class="hero">

/* ---------- render ---------- */
function render() {
  if (composing) { renderLater = true; return; }
  renderLater = false;
  const ae = document.activeElement, keep = ae && ae.id && $('#view').contains(ae) ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
  const tab = U.view === 'book' ? 'library' : U.view;
  document.querySelectorAll('.tab').forEach(t => t.toggleAttribute('aria-current', false) || (t.dataset.tab === tab && t.setAttribute('aria-current', 'page')));
  $('#cBooks').textContent = allBooks().length;
  $('#cQuotes').textContent = live(S.quotes).length;
  $('#hdrYear').textContent = new Date().getFullYear();
  const V = { library: vLibrary, book: vBook, progress: vProgress, quotes: vQuotes, sync: vSync }[U.view] || vLibrary;
  $('#view').innerHTML = V();
  document.title = U.view === 'book' ? `${getBook(U.bookId)?.title || ''} · 책계부` : '책계부';
  updateSyncInd();
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
}

/* ---------- dialogs ---------- */
const dlg = $('#dlg');
function openDlg(kind) { U.dlg = kind; renderDlg(); if (!dlg.open) dlg.showModal(); }
function closeDlg() { if (dlg.open) dlg.close(); }
dlg.addEventListener('close', () => { U.dlg = null; });
dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });
function renderDlg() {
  if (U.dlg === 'book') {
    const b = U.editId ? getBook(U.editId) : null;
    dlg.innerHTML = `<div class="dlg"><div class="grab"></div>
      <div class="dlg-h"><h2 id="dlgTitle">${b ? '책 정보 수정' : '책 추가'}</h2><div class="spacer"></div><button class="icon-btn" data-act="dlgClose" aria-label="닫기">${ICON.close}</button></div>
      <div class="field"><label for="bTitle">제목 *</label><input id="bTitle" class="input" value="${esc(b?.title || '')}" autocomplete="off"></div>
      <div class="field"><label for="bAuthor">저자</label><input id="bAuthor" class="input" value="${esc(b?.author || '')}" autocomplete="off"></div>
      <div class="field"><label for="bStatus">상태</label><select id="bStatus" class="select">${['reading', 'want', 'done'].map(s => `<option value="${s}"${(b?.status || 'reading') === s ? ' selected' : ''}>${STATUS[s]}</option>`).join('')}</select></div>
      <div class="row" style="gap:10px;align-items:flex-start">
        <div class="field" style="flex:1 1 150px"><label for="bStart">읽기 시작한 날</label><input id="bStart" class="input mono" type="date" max="${ymd()}" value="${b ? (b.startedAt || '') : ymd()}"></div>
        <div class="field" style="flex:1 1 150px"><label for="bDone">완독한 날 <span class="subtle">(완독일 때)</span></label><input id="bDone" class="input mono" type="date" max="${ymd()}" value="${b?.finishedAt || ymd()}"></div>
      </div>
      <div class="note" style="margin-top:-6px">'읽고 싶은' 책은 시작일을 비워둬도 돼요.</div>
      <div class="field"><label for="bTags">태그 (쉼표로 구분)</label><input id="bTags" class="input" placeholder="소설, 고전" value="${esc((b?.tags || []).join(', '))}"></div>
      <button class="btn btn-primary btn-lg" data-act="bookSave">${b ? '저장' : '추가하기'}</button></div>`;
    setTimeout(() => $('#bTitle')?.focus(), 30);
    return;
  }
  const Q = U.quick, bs = allBooks();
  const cand = bs.filter(b => b.status === 'reading').concat(bs.filter(b => b.status === 'want'));
  if (Q.mode === 'progress' && !getBook(Q.bookId) && cand[0]) { Q.bookId = cand[0].id; Q.pct = cand[0].progress || 0; }
  const cur = getBook(Q.bookId);
  let body;
  if (Q.mode === 'progress') {
    body = !cand.length && !cur ? `<div class="note">읽는 중인 책이 없어요. 먼저 책을 추가해 주세요.</div><button class="btn btn-lg btn-primary" data-act="addBook">${ICON.plus}책 추가</button>` : `
      <div class="row" style="gap:6px">${(cur && !cand.includes(cur) ? [cur, ...cand] : cand).map(b => `<button class="chip lg" data-act="qBook" data-v="${b.id}" aria-pressed="${b.id === Q.bookId}">${esc(b.title)}</button>`).join('')}</div>
      <div class="field"><label for="qPct">지금 몇 %쯤 읽었나요?</label>
        <div class="stepper"><button class="btn" data-act="qStep" data-v="-5" aria-label="5% 빼기">−</button><input id="qPct" type="number" inputmode="numeric" min="0" max="100" value="${Q.pct}"><button class="btn" data-act="qStep" data-v="5" aria-label="5% 더하기">+</button></div>
        <div class="mono muted" id="qPrev" style="font-size:12px;text-align:center">${quickPrev()}</div></div>
      <button class="btn btn-primary btn-lg" data-act="qSave">기록하기</button>`;
  } else {
    body = `
      <div class="field"><label for="qText">문장</label><textarea id="qText" class="textarea" rows="4" placeholder="책 속 문장이나 문득 떠오른 생각">${esc(Q.text)}</textarea></div>
      <div class="row" style="gap:10px">
        <div class="field" style="flex:1 1 160px"><label for="qSrc">출처</label><select id="qSrc" class="select">
          <option value="">내 생각 (출처 없음)</option>${bs.map(b => `<option value="${b.id}"${Q.src === b.id ? ' selected' : ''}>${esc(b.title)}</option>`).join('')}</select></div>
        <div class="field" style="flex:1 1 120px"><label for="qTag">태그</label><input id="qTag" class="input" placeholder="삶, 태도" value="${esc(Q.tag)}"></div>
      </div>
      <button class="btn btn-primary btn-lg" data-act="qSave">저장</button>`;
  }
  dlg.innerHTML = `<div class="dlg"><div class="grab"></div>
    <div class="dlg-h"><h2 id="dlgTitle">빠른 기록</h2><div class="spacer"></div><button class="icon-btn" data-act="dlgClose" aria-label="닫기">${ICON.close}</button></div>
    <div class="seg full" role="group" aria-label="기록 종류"><button data-act="qMode" data-v="progress" aria-pressed="${Q.mode === 'progress'}">진척 기록</button><button data-act="qMode" data-v="quote" aria-pressed="${Q.mode === 'quote'}">문장 저장</button></div>
    ${body}</div>`;
}
function quickPrev() {
  const b = getBook(U.quick.bookId); if (!b) return '';
  const from = b.progress || 0, to = clamp(U.quick.pct, 0, 100), d = to - from;
  return d ? `${d > 0 ? '+' : ''}${d}% · ${from}% → ${to}%${to >= 100 ? ' · 완독!' : ''}` : `지금 ${from}%`;
}
function openQuick(mode) {
  const Q = U.quick; Q.mode = mode || Q.mode || 'progress';
  if (U.view === 'book' && getBook(U.bookId)) { Q.bookId = U.bookId; Q.src = U.bookId; }
  const b = getBook(Q.bookId); Q.pct = b ? b.progress || 0 : 0;
  openDlg('quick');
}

/* ---------- actions ---------- */
function addQuote(text, bookId, tag) {
  text = (text || '').trim(); if (!text) { toast('문장을 입력해 주세요'); return false; }
  const b = bookId ? getBook(bookId) : null;
  S.quotes.push({ id: uid(), text, bookId: b ? b.id : null, bookTitle: b ? b.title : '', tag: (tag || '').replace(/^#/, '').trim(), fav: false, createdAt: now(), updatedAt: now() });
  return true;
}
const ACT = {
  theme() { setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); },
  quick() { openQuick('progress'); },
  newQuote() { openQuick('quote'); },
  addBook() { U.editId = null; openDlg('book'); },
  editBook() { U.editId = U.bookId; openDlg('book'); },
  bookSave() {
    const title = $('#bTitle').value.trim(); if (!title) { toast('제목을 입력해 주세요'); $('#bTitle').focus(); return; }
    const tags = $('#bTags').value.split(',').map(s => s.trim().replace(/^#/, '')).filter(Boolean);
    const status = $('#bStatus').value, author = $('#bAuthor').value.trim();
    const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v);
    const doneDate = isDate($('#bDone').value) ? $('#bDone').value : ymd();
    const startDate = isDate($('#bStart').value) ? $('#bStart').value : '';
    let b = U.editId ? getBook(U.editId) : null;
    const isNew = !b;
    if (b) { Object.assign(b, { title, author, tags }); if (status !== b.status) applyStatus(b, status); }
    else {
      b = { id: uid(), title, author, tags, status: 'want', progress: 0, rating: 0, oneLine: '', memo: '', startedAt: '', finishedAt: '', lastReadAt: '', createdAt: now(), updatedAt: now() };
      S.books.push(b);
      // 이미 다 읽은 책을 등록할 때는 '오늘 100% 읽음' 기록을 만들지 않아요
      if (status === 'done') { b.status = 'done'; b.progress = 100; }
      else applyStatus(b, status);
    }
    if (b.status === 'done') b.finishedAt = doneDate;
    if (startDate) b.startedAt = startDate;
    else if (b.status === 'want') b.startedAt = '';
    touch(b);
    persist(); closeDlg(); U.dlgReturn = null;
    go('book/' + encodeURIComponent(b.id)); toast(isNew ? '책을 추가했어요' : '저장했어요');
  },
  async delBook() {
    const b = getBook(U.bookId); if (!b) return;
    if (!(await ask(`'${b.title}'을(를) 삭제할까요?\n진척 기록도 함께 지워져요. 모은 문장은 남아요.`, '삭제', true))) return;
    b.deleted = true; touch(b);
    for (const l of S.logs) if (l.bookId === b.id && !l.deleted) { l.deleted = true; touch(l); }
    persist(); go('library'); toast('삭제했어요');
  },
  status(v) { const b = getBook(U.bookId); applyStatus(b, v); touch(b); persist(); render(); },
  setPct() { const b = getBook(U.bookId); if (setProgress(b, $('#pctIn').value)) { persist(); render(); toast(b.progress >= 100 ? '완독을 축하해요!' : '기록했어요'); } },
  addPct(v) { const b = getBook(U.bookId); const to = v === '100' ? 100 : (b.progress || 0) + Number(v); if (setProgress(b, to)) { persist(); render(); toast(b.progress >= 100 ? '완독을 축하해요!' : '기록했어요'); } },
  rate(v) { const b = getBook(U.bookId); const n = Number(v); b.rating = b.rating === n ? 0 : n; touch(b); persist(); render(); },
  addQuoteInline() { if (addQuote($('#newQ').value, U.bookId, '')) { persist(); render(); toast('문장을 모았어요'); } },
  async delQuote(id) { const q = S.quotes.find(x => x.id === id); if (!q || !(await ask('이 문장을 삭제할까요?', '삭제', true))) return; q.deleted = true; touch(q); persist(); render(); },
  favQuote(id) { const q = S.quotes.find(x => x.id === id); q.fav = !q.fav; touch(q); persist(); render(); },
  copyQuote(id) {
    const q = S.quotes.find(x => x.id === id), t = `${q.text}\n— ${quoteSrc(q)}`;
    copyText(t).then(ok => toast(ok ? '복사했어요' : '복사하지 못했어요'));
  },
  libFilter(v) { U.libFilter = v; render(); },
  qFilter(v) { U.qFilter = v; render(); },
  qFilterGo(v) { U.qFilter = v; go('quotes'); },
  randomQ() { const qs = live(S.quotes).filter(q => q.id !== U.heroId); if (!qs.length) { toast('다른 문장이 없어요'); return; } U.randomQ = qs[Math.floor(Math.random() * qs.length)].id; render(); },
  year(v) { U.year = Number(v); render(); },
  async seed() {
    if (allBooks().length && !(await ask('예시 책과 문장을 지금 기록에 추가할까요?\n나중에 \'모든 기록 지우기\'로 지울 수 있어요.', '추가'))) return;
    seed(); persist(); go('library'); render(); toast('예시 데이터를 넣었어요');
  },
  async clearSample() {
    if (!(await ask('예시로 넣은 책·기록·문장을 지울까요?\n직접 추가한 기록은 그대로 남아요.', '예시 지우기', true))) return;
    for (const arr of [S.books, S.logs, S.quotes]) for (const x of arr) if (x.sample && !x.deleted) { x.deleted = true; touch(x); }
    U.randomQ = null; U.qFilter = 'all';
    persist(); go('library'); toast('예시 데이터를 지웠어요');
  },
  export() {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `책계부-${ymd()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  import() { $('#importFile').click(); },
  async resetAll() {
    if (!(await ask('모든 책, 기록, 문장을 지울까요?\n동기화 중이라면 다른 기기에서도 지워져요. 되돌릴 수 없어요.', '모두 지우기', true))) return;
    for (const arr of [S.books, S.logs, S.quotes]) for (const x of arr) if (!x.deleted) { x.deleted = true; touch(x); }
    persist(); go('library'); render(); toast('모두 지웠어요');
  },
  dlgClose() { closeDlg(); },
  qMode(v) { U.quick.mode = v; if (v === 'quote' && !U.quick.src && U.view === 'book') U.quick.src = U.bookId; renderDlg(); },
  qBook(id) { const b = getBook(id); U.quick.bookId = id; U.quick.pct = b.progress || 0; renderDlg(); },
  qStep(v) { U.quick.pct = clamp((Number($('#qPct').value) || 0) + Number(v), 0, 100); renderDlg(); },
  qSave() {
    const Q = U.quick;
    if (Q.mode === 'progress') {
      const b = getBook(Q.bookId); if (!b) return;
      Q.pct = clamp(Number($('#qPct').value) || 0, 0, 100);
      if (!setProgress(b, Q.pct)) { toast('바뀐 진척이 없어요'); return; }
      persist(); closeDlg(); render(); toast(b.progress >= 100 ? `'${b.title}' 완독을 축하해요!` : `${b.title} ${b.progress}% 기록했어요`);
    } else {
      if (!addQuote($('#qText').value, $('#qSrc').value, $('#qTag').value)) return;
      Q.text = ''; Q.tag = ''; persist(); closeDlg(); render(); toast('문장을 모았어요');
    }
  },
  /* sync */
  copySql() { copyText(SQL).then(ok => toast(ok ? 'SQL을 복사했어요' : '복사하지 못했어요. 코드를 직접 선택해 복사해 주세요')); },
  async saveCfg() {
    const url = $('#cfgUrl').value.trim().replace(/\/+$/, ''), key = $('#cfgKey').value.trim();
    if (!/^https:\/\/[^\s]+$/.test(url) || key.length < 20) { toast('URL과 키를 확인해 주세요'); return; }
    try { localStorage.setItem(LS_CFG, JSON.stringify({ url, key })); } catch (e) { toast('이 화면에서는 설정을 저장할 수 없어요'); return; }
    await sbInit(); render();
  },
  async clearCfg() {
    if (!(await ask('이 기기의 Supabase 연결 정보를 지울까요? 기록은 남아요.', '지우기'))) return;
    try { if (sb) await sb.auth.signOut(); } catch (e) {}
    try { localStorage.removeItem(LS_CFG); } catch (e) {} clearBase(); sb = null; sbUser = null; setSync('off'); render();
  },
  async sendLink() {
    const email = $('#loginEmail').value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) { toast('이메일을 확인해 주세요'); return; }
    if (!sb) { await sbInit(); if (!sb) return; }
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) { syncInfo.msg = '링크를 보내지 못했어요: ' + error.message; render(); return; }
    syncInfo.msg = ''; toast('메일로 로그인 링크를 보냈어요'); render();
  },
  async logout() { if (sb) await sb.auth.signOut(); sbUser = null; clearBase(); setSync('loggedout'); render(); },
  syncNow() { syncNow(true); }
};
/* 상태 바꾸기: '완독'을 눌렀다가 되돌리면 완독 직전 퍼센트로 돌아가요 */
function applyStatus(b, s) {
  const today = ymd();
  if (s === b.status) return;
  if (s === 'done') {
    if ((b.progress || 0) < 100) { b.prevProgress = b.progress || 0; setProgress(b, 100); }
    b.status = 'done'; b.finishedAt = b.finishedAt || today;
    return;
  }
  if (b.status === 'done') {
    let back = typeof b.prevProgress === 'number' ? b.prevProgress : null;
    if (back === null) {   // 예전 데이터: 100%에 도달한 기록의 시작점으로
      const fin = live(S.logs).filter(l => l.bookId === b.id && l.to >= 100).sort((x, y) => y.date.localeCompare(x.date))[0];
      if (fin) back = fin.from;
    }
    if (back !== null && back < 100) setProgress(b, back);   // 오늘 생긴 100% 기록도 함께 되돌려요
    else if ((b.progress || 0) >= 100) b.progress = 0;
    delete b.prevProgress;
    b.finishedAt = '';
  }
  b.status = s;
  if (s === 'reading' && !b.startedAt) b.startedAt = today;
}

$('#importFile').addEventListener('change', async e => {

/* ---------- theme & toast ---------- */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(LS_THEME, t); } catch (e) {}
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#2a241e' : '#f3ece0';
}
let toastTimer;

/* ---------- Supabase sync ---------- */
let sb = null, sbUser = null, syncing = false, again = false, pushTimer = null;
const syncInfo = { status: 'off', at: null, msg: '' };
function getCfg() {
  if (SUPABASE_URL && SUPABASE_ANON_KEY) return { url: SUPABASE_URL, key: SUPABASE_ANON_KEY, fixed: true };
  try { return JSON.parse(localStorage.getItem(LS_CFG)); } catch (e) { return null; }
}
function setSync(status, msg) { syncInfo.status = status; syncInfo.msg = msg || ''; if (status === 'ok') syncInfo.at = new Date(); updateSyncInd(); }
function updateSyncInd() {
  const el = $('#syncInd'); if (!el) return;
  const m = { off: ['', '이 기기에만 저장'], loggedout: ['', '로그인 필요'], ok: ['ok', '동기화됨'], syncing: ['busy', '동기화 중'], pending: ['busy', '저장 대기'], error: ['err', '동기화 오류'] }[syncInfo.status] || ['', ''];
  el.innerHTML = `<span class="dot ${m[0]}"></span><span class="hide-sm">${m[1]}</span>`;
  el.setAttribute('aria-label', '동기화 상태: ' + m[1]);
}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('라이브러리를 불러오지 못했어요')); document.head.appendChild(s); }); }
async function sbInit() {
  const c = getCfg(); if (!c) { setSync('off'); return; }
  if (sb && sb.__url === c.url) { if (sbUser) syncNow(); return; }
  try {
    if (!window.supabase) await loadScript(SB_CDN);
    sb = window.supabase.createClient(c.url, c.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit' } });
    sb.__url = c.url;
    const { data } = await sb.auth.getSession();
    sbUser = data.session?.user || null;
    if (/access_token|error_description/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search + '#library'); } catch (e) {} route('library'); }
    sb.auth.onAuthStateChange((ev, ses) => {
      const was = sbUser; sbUser = ses?.user || null;
      if (sbUser && !was) { syncNow(); render(); } else if (!sbUser && was) { setSync('loggedout'); render(); }
    });
    if (sbUser) await syncNow(); else setSync('loggedout');
  } catch (e) { sb = null; setSync('error', 'Supabase 연결 실패: ' + e.message); }
}
function schedulePush() {
  if (!sb || !sbUser) return;
  setSync('pending'); clearTimeout(pushTimer); pushTimer = setTimeout(syncNow, 1500);
}
async function syncNow(manual) {
  if (!sb || !sbUser) return;
  if (syncing) { again = true; return; }
  syncing = true; setSync('syncing');
  try {
    const before = JSON.stringify(S), conflicts = [];
    let saved = false;
    for (let attempt = 0; attempt < 5 && !saved; attempt++) {
      const r = await sb.from('ledger').select('data,rev').eq('user_id', sbUser.id).maybeSingle();
      if (r.error) throw r.error;
      if (r.data && r.data.data) S = merge3(S, normalize(r.data.data), loadBase(), conflicts);
      try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
      const payload = JSON.parse(JSON.stringify(S));
      if (r.data) {
        // 내가 읽은 뒤 다른 기기가 먼저 저장했다면(rev가 달라졌다면) 다시 읽어서 합쳐요
        const rev = Number(r.data.rev) || 0;
        const w = await sb.from('ledger').update({ data: payload, rev: rev + 1, updated_at: now() }).eq('user_id', sbUser.id).eq('rev', rev).select('rev');
        if (w.error) throw w.error;
        saved = !!(w.data && w.data.length);
      } else {
        const w = await sb.from('ledger').insert({ user_id: sbUser.id, data: payload, rev: 1 });
        if (w.error && w.error.code !== '23505') throw w.error;
        saved = !w.error;
      }
      if (saved) saveBase(payload);
      else await new Promise(res => setTimeout(res, 150 + Math.random() * 350));
    }
    if (!saved) throw new Error('다른 기기와 동시에 저장하고 있어요. 잠시 뒤 다시 시도할게요.');
    setSync('ok');
    if (JSON.stringify(S) !== before || U.view === 'sync') render();
    if (conflicts.length) toast(`두 기기에서 같은 글을 고쳐서 둘 다 남겨뒀어요 (${[...new Set(conflicts)].filter(Boolean).slice(0, 2).join(', ')})`);
    else if (manual === true) toast('동기화했어요');
  } catch (e) {
    const msg = e.message || String(e);
    setSync('error', /relation|does not exist|schema cache|column/i.test(msg) ? 'ledger 표가 없거나 예전 구조예요. 동기화 탭의 SQL을 Supabase에서 실행해 주세요.' : msg);
    if (/동시에 저장/.test(msg)) setTimeout(syncNow, 3000);
    if (U.view === 'sync') render();
  } finally {
    syncing = false;
    if (again) { again = false; setTimeout(syncNow, 400); }
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });

/* ---------- 예시 데이터 ---------- */
function seed() {
  const today = new Date(), Y = today.getFullYear();
  const day = n => ymd(addDays(today, -n));
  let r = 7; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  const mk = (title, author, tags, status, extra) => {
    const b = Object.assign({ id: uid(), title, author, tags, status, progress: 0, rating: 0, oneLine: '', memo: '', startedAt: '', finishedAt: '', lastReadAt: '', createdAt: now(), updatedAt: now(), sample: true }, extra);
    S.books.push(b); return b;
  };
  const logRun = (b, startDaysAgo, target, endDaysAgo = 0) => {
    let p = 0, d = startDaysAgo; b.startedAt = day(startDaysAgo);
    while (d >= endDaysAgo && p < target) {
      if (rnd() < 0.62) { const avg = target / ((startDaysAgo - endDaysAgo + 1) * 0.62); const step = Math.min(target - p, Math.max(1, Math.round(avg * (0.5 + rnd())))); S.logs.push({ id: uid(), bookId: b.id, date: day(d), from: p, to: p + step, updatedAt: now(), sample: true }); p += step; b.lastReadAt = day(d); }
      d--;
    }
    if (p < target) { S.logs.push({ id: uid(), bookId: b.id, date: day(endDaysAgo), from: p, to: target, updatedAt: now(), sample: true }); p = target; b.lastReadAt = day(endDaysAgo); }
    b.progress = p; if (p >= 100) b.finishedAt = b.lastReadAt;
  };
  const doy = Math.floor((today - new Date(Y, 0, 1)) / 864e5);
  const span = Math.max(40, doy);
  const demian = mk('데미안', '헤르만 헤세', ['소설', '고전'], 'done', { rating: 5, oneLine: '나를 찾는다는 말이 처음 와닿았다.', memo: '싱클레어가 자기 안의 목소리를 따라가는 이야기. 다시 읽으면 또 다르게 읽힐 것 같다.' });
  logRun(demian, Math.min(span, 200), 100, Math.min(span - 1, 170));
  const kafka = mk('변신', '프란츠 카프카', ['소설'], 'done', { rating: 4, oneLine: '짧은데 오래 남는다.' });
  logRun(kafka, Math.min(span, 120), 100, Math.min(span - 1, 112));
  const frank = mk('프랑켄슈타인', '메리 셸리', ['소설', '고전'], 'done', { rating: 4, oneLine: '괴물보다 만든 사람이 더 무섭다.' });
  logRun(frank, Math.min(span, 90), 100, Math.min(span - 1, 60));
  const walden = mk('월든', '헨리 데이비드 소로', ['에세이', '자연'], 'reading', { oneLine: '단순하게 사는 법에 대한 긴 일기 같다.', memo: '호수를 묘사하는 부분부터 문장이 살아난다.\n가진 게 적을수록 시간이 많아진다는 계산이 인상적이었다.' });
  logRun(walden, 30, 62, 1);
  const med = mk('명상록', '마르쿠스 아우렐리우스', ['철학'], 'reading', { oneLine: '아침마다 한 장씩.' });
  logRun(med, 45, 35, 3);
  const pride = mk('오만과 편견', '제인 오스틴', ['소설'], 'reading', {});
  logRun(pride, 4, 12, 0);
  mk('위대한 개츠비', 'F. 스콧 피츠제럴드', ['소설'], 'want', {});
  const q = (text, b, tag, daysAgo, fav) => S.quotes.push({ id: uid(), text, bookId: b ? b.id : null, bookTitle: b ? b.title : '', tag, fav: !!fav, createdAt: addDays(today, -daysAgo).toISOString(), updatedAt: now(), sample: true });
  q('새는 알에서 나오려고 투쟁한다. 알은 하나의 세계다. 태어나려는 자는 하나의 세계를 깨뜨려야 한다.', demian, '나', 180, true);
  q('나는 내 속에서 스스로 솟아나려는 것, 바로 그것을 살아보려 했을 뿐이다.', demian, '나', 185);
  q('어느 날 아침 그레고르 잠자가 불안한 꿈에서 깨어났을 때, 그는 자신이 침대 속에서 흉측한 벌레로 변해 있는 것을 발견했다.', kafka, '첫문장', 118);
  q('나는 신중하게 살고 싶어서 숲으로 갔다. 삶의 본질만을 마주하고 싶었다.', walden, '삶', 2, true);
  q('우리의 삶은 사소한 일들로 낭비되고 있다. 단순하게, 단순하게.', walden, '단순함', 9);
  q('지금 하는 일을 생애 마지막 일인 것처럼 하라.', med, '태도', 4);
  q('외부의 일이 너를 괴롭히는 것이 아니라, 그 일에 대한 너의 판단이 너를 괴롭힌다.', med, '마음', 3);
  q('퇴근길 지하철에서, 오늘 하루를 한 문장으로 줄이면 무엇일지 생각했다.', null, '메모', 6);
}

/* ---------- start ---------- */
(function init() {
  let t = null; try { t = localStorage.getItem(LS_THEME); } catch (e) {}
  setTheme(t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  updateSyncInd();

  sbInit();
})();
