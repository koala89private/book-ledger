<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>책계부</title>
<meta name="description" content="읽은 책, 독서록, 진척도, 마음에 남은 문장을 기록하는 개인 책계부">
<meta name="theme-color" content="#f3ece0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c0673a' stroke-width='2' stroke-linejoin='round'%3E%3Cpath d='M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z'/%3E%3Cpath d='M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* =====================================================================
   디자인 토큰 — 색·간격·둥글기·글자·높이는 모두 여기서만 정해요
   간격: 4의 배수 / 둥글기: 5단계 / 글자: 7단계 / 높이: 3단계
   ===================================================================== */
:root{
  /* 색 */
  --bg:#f8f3ea; --card:#fffdf8; --subtle:#f3ece0; --muted:#efe7da;
  --border:#e6dccb; --bs:#dccfb9; --be:#b9a68c;
  --fg:#2b2520; --fm:#5f5346; --fs:#76695b;
  --acc:#c0673a; --acc2:#8a4322; --acc-soft:#efcfae;
  --ink:#2b2520; --ink-fg:#fffdf8;
  --hero:#3a2e25; --hero-fg:#fffdf8; --hero-sub:#efcfae; --hero-mute:#d9cbb8; --hero-line:rgba(255,255,255,.24);
  --ok:#5f8a4e; --danger:#a5402a; --on-danger:#fffdf8;
  --h0:#efe7da; --h1:#efcfae; --h2:#dea075; --h3:#c0673a; --h4:#8a4322;
  --cv1:#2b2520; --cv1f:#fffdf8; --cv2:#c0673a; --cv2f:#fffdf8; --cv3:#8a4322; --cv3f:#fffdf8;
  --cv4:#e3d3bb; --cv4f:#2b2520; --cv5:#5f5346; --cv5f:#fffdf8; --cv6:#dea075; --cv6f:#2b2520; --cv7:#efcfae; --cv7f:#2b2520;
  --shadow:0 12px 32px rgba(43,37,32,.18); --overlay:rgba(43,37,32,.42);
  /* 간격 (4의 배수) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;
  /* 둥글기 */
  --r-xs:2px;   /* 잔디·작은 데이터 칸 */
  --r-sm:4px;   /* 카드 안 작은 요소, 작은 표지 */
  --r-md:8px;   /* 버튼·입력·카드 */
  --r-lg:12px;  /* 창·강조 카드 */
  --r-pill:999px;
  --r-book:var(--r-xs) var(--r-sm) var(--r-sm) var(--r-xs);
  --r-book-lg:var(--r-sm) var(--r-md) var(--r-md) var(--r-sm);
  /* 글자 */
  --fs-xs:11px; --fs-sm:12px; --fs-md:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:28px; --fs-3xl:36px;
  --sans:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* 높이 */
  --h-sm:32px; --h-md:36px; --h-lg:44px;
  color-scheme:light;
}
@media (pointer:coarse){ :root{ --h-sm:36px; --h-md:44px; --h-lg:48px; } }
:root[data-theme="dark"]{
  --bg:#1c1814; --card:#241f1a; --subtle:#2a241e; --muted:#332c25;
  --border:#3a322a; --bs:#4a3f34; --be:#6e5f4f;
  --fg:#f3ebe0; --fm:#cdbda9; --fs:#a8977f;
  --acc:#e08a5c; --acc2:#f0b48f; --acc-soft:#5a3a26;
  --ink:#f3ebe0; --ink-fg:#1c1814;
  --hero:#2e2620; --hero-fg:#f3ebe0; --hero-sub:#e8a07a; --hero-mute:#bfae98;
  --ok:#8fbf7a; --danger:#e48a72; --on-danger:#1c1814;
  --h0:#2a241e; --h1:#5a3a26; --h2:#8a5232; --h3:#c0673a; --h4:#e8a07a;
  --cv1:#f3ebe0; --cv1f:#1c1814;
  --shadow:0 12px 32px rgba(0,0,0,.55); --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}

/* ===== 기본 ===== */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:var(--fs-md);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(var(--s5),env(safe-area-inset-left));padding-right:max(var(--s5),env(safe-area-inset-right))}

/* ===== 레이아웃 ===== */
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.stack.g1{gap:var(--s1)} .stack.g2{gap:var(--s2)} .stack.g4{gap:var(--s4)} .stack.g6{gap:var(--s6)}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2)}
.row.g1{gap:var(--s1)} .row.g3{gap:var(--s3)} .row.g4{gap:var(--s4)}
.row.nowrap{flex-wrap:nowrap} .row.end{align-items:flex-end} .row.top{align-items:flex-start} .row.base{align-items:baseline}
.grow{flex:1 1 0;min-width:0}
.spacer{flex:1}
.cols{display:flex;flex-wrap:wrap;gap:var(--s6);align-items:flex-start}
.col{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:var(--s4)}
.col.wide{flex-basis:420px}
.col.x2{flex:2 1 460px} .col.x1{flex:1 1 280px}

/* ===== 글자 ===== */
.t-xs{font-size:var(--fs-xs)} .t-sm{font-size:var(--fs-sm)} .t-md{font-size:var(--fs-md)} .t-lg{font-size:var(--fs-lg)}
.t-xl{font-size:var(--fs-xl)} .t-2xl{font-size:var(--fs-2xl)} .t-3xl{font-size:var(--fs-3xl)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.muted{color:var(--fm)} .subtle{color:var(--fs)} .acc{color:var(--acc)} .danger-t{color:var(--danger)}
.strong{font-weight:700}
.nowrap-t{white-space:nowrap}
.wrap-any{overflow-wrap:anywhere;word-break:break-word}
.big{font-family:var(--mono);font-size:var(--fs-3xl);font-weight:700;line-height:1}
.num{font-family:var(--mono);font-size:var(--fs-2xl);font-weight:700;line-height:1.1}

/* ===== 버튼 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:var(--h-md);padding:0 var(--s4);border:1px solid var(--bs);border-radius:var(--r-md);background:var(--subtle);font-size:var(--fs-md);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s}
.btn:hover{background:var(--muted);border-color:var(--be)}
.btn-sm{height:var(--h-sm);padding:0 var(--s3);font-size:var(--fs-sm)}
.btn-lg{height:var(--h-lg);font-size:var(--fs-lg);font-weight:700}
.btn-primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn-primary:hover{background:var(--ink);border-color:var(--ink);opacity:.88}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--muted);border-color:transparent}
.btn-danger{color:var(--danger)}
.btn-danger-fill{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.btn-danger-fill:hover{background:var(--danger);border-color:var(--danger);opacity:.88}
.btn-icon{width:var(--h-md);padding:0}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.icon-btn{width:var(--h-sm);height:var(--h-sm);display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:var(--r-md);background:none;color:var(--fm);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--muted);color:var(--fg)}
.icon-btn.on{color:var(--acc)} .icon-btn.on svg{fill:currentColor}

/* ===== 입력 ===== */
.input,.select,.textarea{height:var(--h-md);padding:0 var(--s3);border:1px solid var(--bs);border-radius:var(--r-md);background:var(--card);font-size:var(--fs-md);min-width:0}
.input-sm{height:var(--h-sm);font-size:var(--fs-sm)}
.textarea{height:auto;padding:var(--s3);resize:vertical;line-height:1.7;width:100%}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.w-num{width:96px} .w-xs{width:72px}
.field{display:flex;flex-direction:column;gap:var(--s1)}
.field>label,.flabel{font-size:var(--fs-sm);color:var(--fm)}
.field[hidden]{display:none}

/* ===== 선택 그룹·칩·라벨 ===== */
.seg{display:inline-flex;border:1px solid var(--bs);border-radius:var(--r-md);overflow:hidden;background:var(--subtle);max-width:100%;overflow-x:auto;flex:none}
.seg button{border:0;background:transparent;height:var(--h-sm);padding:0 var(--s3);font-size:var(--fs-sm);cursor:pointer;color:var(--fm);border-right:1px solid var(--bs);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:700;box-shadow:inset 0 -2px 0 var(--fg)}
.seg.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
.seg.full button{height:var(--h-md);font-size:var(--fs-md)}
.chip{height:var(--h-sm);padding:0 var(--s3);border-radius:var(--r-pill);border:1px solid var(--bs);background:var(--card);color:var(--fm);font-size:var(--fs-sm);cursor:pointer;white-space:nowrap;max-width:min(240px,100%);overflow:hidden;text-overflow:ellipsis}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ink-fg);font-weight:700}
.chip.lg{height:var(--h-md);font-size:var(--fs-md);padding:0 var(--s4)}
.label{display:inline-flex;align-items:center;height:20px;padding:0 var(--s2);border:1px solid var(--bs);border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:500;color:var(--fm);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.label.on{border-color:var(--fg);color:var(--fg);font-weight:700}
.label.done{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.label.want{border-style:dashed}
.counter{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 var(--s1);border-radius:var(--r-pill);background:var(--muted);border:1px solid var(--border);font-family:var(--mono);font-size:var(--fs-xs);font-weight:600;line-height:1}

/* ===== 진척 막대 (한 가지 컴포넌트, 두 크기) ===== */
.bar{height:8px;border-radius:var(--r-pill);background:var(--muted);overflow:hidden;flex:1;min-width:48px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:var(--r-pill)}
.bar.lg{height:12px}
.prog{display:flex;align-items:center;gap:var(--s2)}
.prog>b{font-family:var(--mono);font-size:var(--fs-sm);width:40px;text-align:right;flex:none}

/* ===== 카드(box) — 바깥 8px, 머리글은 테두리 안쪽이라 8-1px ===== */
.box{border:1px solid var(--bs);border-radius:var(--r-md);background:var(--card)}
.box-h{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;min-height:48px;padding:var(--s2) var(--s4);background:var(--subtle);border-bottom:1px solid var(--bs);border-radius:calc(var(--r-md) - 1px) calc(var(--r-md) - 1px) 0 0}
.box-h h2{font-size:var(--fs-md);font-weight:700}
.box-b{padding:var(--s4)}
.box-sep{border-top:1px solid var(--border)}
.box-sub{padding:var(--s3) var(--s4) var(--s1);font-size:var(--fs-sm);font-weight:700;color:var(--fm)}
.notice{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;padding:var(--s3) var(--s4);border:1px solid var(--h2);border-radius:var(--r-md);background:var(--subtle);font-size:var(--fs-md)}

/* ===== 머리글·탭 ===== */
.hdr{position:sticky;top:0;z-index:20;background:var(--subtle);border-bottom:1px solid var(--bs);padding-top:env(safe-area-inset-top)}
.hdr-in{display:flex;align-items:center;gap:var(--s2);height:56px}
.brand{display:flex;align-items:center;gap:var(--s2);font-weight:700;font-size:var(--fs-lg);text-decoration:none}
.brand svg{width:20px;height:20px;stroke:var(--acc)}
.sync-ind{display:inline-flex;align-items:center;gap:var(--s2);height:var(--h-sm);padding:0 var(--s2);font-size:var(--fs-sm);color:var(--fm);text-decoration:none;border-radius:var(--r-md)}
.sync-ind:hover{background:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--be);flex:none}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--acc);animation:pulse 1s infinite} .dot.err{background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}
.tabnav{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none}
.tabnav::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:var(--s2);height:44px;padding:0 var(--s3);font-size:var(--fs-md);color:var(--fm);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg);font-weight:700;border-bottom-color:var(--fg)}
@media (max-width:640px){.hide-sm{display:none!important}}

/* ===== 본문 ===== */
main{padding-top:var(--s6);padding-bottom:var(--s10);display:flex;flex-direction:column;gap:var(--s6)}
.page-h{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.page-h h1{font-size:var(--fs-xl)}
.sec-h{display:flex;align-items:center;gap:var(--s2)}
.sec-h h2{font-size:var(--fs-lg)}
.crumbs{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-md);color:var(--fm)}
.crumbs a{flex:none;white-space:nowrap;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs .sep{flex:none;color:var(--fs)}
.crumbs b{color:var(--fg);min-width:0;overflow-wrap:anywhere}

/* 통계 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:var(--s3)}
@media (max-width:640px){ .stat{padding:var(--s3)} .stat .num{font-size:var(--fs-xl)} }
.stat{border:1px solid var(--bs);border-radius:var(--r-md);background:var(--card);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.stat .k{font-size:var(--fs-sm);color:var(--fm)}
.stat .v{display:flex;align-items:baseline;gap:var(--s2)}
.stat .v span{font-family:var(--mono);font-size:var(--fs-sm);color:var(--fm)}
.stat .s{font-size:var(--fs-xs);color:var(--fs)}
.stat .bar{flex:none}

/* 표지 (책 모양만 예외 둥글기) */
.cover{position:relative;flex:none;width:64px;height:92px;border-radius:var(--r-book);display:flex;flex-direction:column;justify-content:flex-end;padding:var(--s2);box-shadow:inset 4px 0 0 rgba(0,0,0,.14);border:1px solid rgba(0,0,0,.12);overflow:hidden}
.cover b{font-family:var(--serif);font-size:var(--fs-xs);line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.cover small{font-size:var(--fs-xs);opacity:.75}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;background:var(--muted)}
.cover.lg{width:120px;height:172px;padding:var(--s3);border-radius:var(--r-book-lg)}
.cover.lg b{font-size:var(--fs-lg)}
.cover.xs{width:36px;height:52px;padding:var(--s1)}
.cover.xs b{font-size:9px;display:none}
.cv1{background:var(--cv1);color:var(--cv1f)} .cv2{background:var(--cv2);color:var(--cv2f)} .cv3{background:var(--cv3);color:var(--cv3f)}
.cv4{background:var(--cv4);color:var(--cv4f)} .cv5{background:var(--cv5);color:var(--cv5f)} .cv6{background:var(--cv6);color:var(--cv6f)} .cv7{background:var(--cv7);color:var(--cv7f)}
.cover-btn{position:relative;flex:none;align-self:flex-start;border:0;padding:0;background:none;cursor:pointer;border-radius:var(--r-book-lg)}
.cover-btn .hint{position:absolute;left:var(--s2);right:var(--s2);bottom:var(--s2);padding:var(--s1) 0;border-radius:var(--r-sm);background:rgba(0,0,0,.6);color:#fffdf8;font-size:var(--fs-xs);text-align:center;opacity:0;transition:opacity .15s}
.cover-btn:hover .hint,.cover-btn:focus-visible .hint{opacity:1}

/* 읽는 중 카드 — 카드 8px, 안쪽 여백 16px → 안쪽 표지는 작은 둥글기 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--s3)}
.bcard{display:flex;gap:var(--s4);padding:var(--s4);border:1px solid var(--bs);border-radius:var(--r-md);background:var(--card);text-decoration:none;color:var(--fg);transition:border-color .12s,transform .12s}
.bcard:hover{border-color:var(--be);transform:translateY(-1px)}
.bcard .t{font-family:var(--serif);font-weight:700;font-size:var(--fs-lg);line-height:1.4;overflow-wrap:anywhere}
.bcard .a{font-size:var(--fs-sm);color:var(--fm);overflow-wrap:anywhere}

/* 전체 책: 넓은 화면은 표, 좁은 화면은 목록 */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--fs-md)}
th{text-align:left;font-weight:500;font-size:var(--fs-sm);color:var(--fm);padding:var(--s3) var(--s4);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:var(--s3) var(--s4);border-bottom:1px solid var(--muted);vertical-align:middle;overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
td a.tt{font-weight:700;text-decoration:none;font-family:var(--serif)}
td a.tt:hover{text-decoration:underline}
.stars{font-family:var(--mono);letter-spacing:1px;color:var(--acc);white-space:nowrap}
.lrow{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--muted);text-decoration:none;color:var(--fg)}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--subtle)}
.lrow .t{font-family:var(--serif);font-weight:700;overflow-wrap:anywhere}
.only-narrow{display:none}
@media (max-width:720px){ .only-wide{display:none} .only-narrow{display:block} }
.empty-row{padding:var(--s6) var(--s4);font-size:var(--fs-sm);color:var(--fs)}

/* 표지 갤러리 — 표지가 주인공, 글은 최소 */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:var(--s5) var(--s4);padding:var(--s4)}
@media (max-width:640px){ .gallery{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4) var(--s3);padding:var(--s3)} }
.gtile{display:flex;flex-direction:column;gap:var(--s2);text-decoration:none;color:var(--fg);min-width:0}
.gtile .cover{width:100%;height:auto;aspect-ratio:2/3;padding:var(--s3);box-shadow:inset 4px 0 0 rgba(0,0,0,.14),0 2px 8px rgba(43,37,32,.12);transition:transform .15s,box-shadow .15s}
.gtile .cover b{font-size:var(--fs-md)}
.gtile:hover .cover{transform:translateY(-2px);box-shadow:inset 4px 0 0 rgba(0,0,0,.14),0 8px 20px rgba(43,37,32,.18)}

const live = a => a.filter(x => !x.deleted);
const allBooks = () => live(S.books);

const bookLogs = id => live(S.logs).filter(l => l.bookId === id).sort((a, b) => (b.date + b.updatedAt).localeCompare(a.date + a.updatedAt));

const quoteSrc = q => q.bookId ? (getBook(q.bookId)?.title || q.bookTitle || '지운 책') : '내 생각';

function mergeArr(a, b) {
  const m = new Map();
  for (const x of a) m.set(x.id, x);
  for (const x of b) { const y = m.get(x.id); if (!y || (x.updatedAt || '') > (y.updatedAt || '')) m.set(x.id, x); }
  return [...m.values()];
}
function merge(a, b) {
  return {
    books: mergeArr(a.books, b.books), logs: mergeArr(a.logs, b.logs), quotes: mergeArr(a.quotes, b.quotes),
    settings: (b.settings.updatedAt || '') > (a.settings.updatedAt || '') ? b.settings : a.settings
  };
}

/* ---------- 동기화 병합 (3방향) ----------
   base  = 마지막으로 서버와 맞춘 상태
   local = 이 기기, remote = 서버
   항목의 칸(필드)마다: 한쪽만 바꿨으면 그쪽, 둘 다 바꿨으면
   - 메모·한줄평·문장: 두 내용을 모두 남겨요
   - 그 밖의 값: 나중에 고친 쪽 */
const LS_BASE = 'bookledger.base';
const TEXT_FIELDS = new Set(['memo', 'oneLine', 'text']);
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function loadBase() { try { const r = localStorage.getItem(LS_BASE); return r ? normalize(JSON.parse(r)) : null; } catch (e) { return null; } }
function saveBase(x) { try { localStorage.setItem(LS_BASE, JSON.stringify(x)); } catch (e) {} }
function clearBase() { try { localStorage.removeItem(LS_BASE); } catch (e) {} }
function mergeText(l, r) {
  if (l.includes(r)) return l;
  if (r.includes(l)) return r;
  return `${l}\n\n── 다른 기기에서 쓴 내용 ──\n${r}`;
}
function merge3Item(l, r, b, conflicts, label) {
  if (!l) return r; if (!r) return l;
  const newerR = (r.updatedAt || '') > (l.updatedAt || '');
  if (!b) return newerR ? Object.assign({}, l, r) : Object.assign({}, r, l);
  const out = {};
  for (const k of new Set([...Object.keys(l), ...Object.keys(r)])) {
    if (k === 'updatedAt') continue;
    const lc = !same(l[k], b[k]), rc = !same(r[k], b[k]);
    if (lc && !rc) out[k] = l[k];
    else if (rc && !lc) out[k] = r[k];
    else if (!lc && !rc) out[k] = l[k];
    else if (same(l[k], r[k])) out[k] = l[k];
    else if (TEXT_FIELDS.has(k) && typeof l[k] === 'string' && typeof r[k] === 'string' && l[k] && r[k]) { out[k] = mergeText(l[k], r[k]); conflicts.push(label); }
    else out[k] = newerR ? r[k] : l[k];
  }
  out.updatedAt = newerR ? r.updatedAt : l.updatedAt;
  for (const k of Object.keys(out)) if (out[k] === undefined) delete out[k];
  return out;
}
function merge3(local, remote, base, conflicts = []) {
  const col = k => {
    const L = new Map(local[k].map(x => [x.id, x])), Rm = new Map(remote[k].map(x => [x.id, x]));
    const B = base ? new Map(base[k].map(x => [x.id, x])) : null;
    const ids = new Set([...L.keys(), ...Rm.keys()]);
    return [...ids].map(id => merge3Item(L.get(id), Rm.get(id), B ? B.get(id) : null, conflicts, (L.get(id) || Rm.get(id)).title || (k === 'quotes' ? '문장' : '')));
  };
  return {
    books: col('books'), logs: col('logs'), quotes: col('quotes'),
    settings: merge3Item(local.settings, remote.settings, base ? base.settings : null, conflicts, '설정')
  };
}

/* 진척 기록: 같은 날 같은 책은 한 줄로 합쳐요 */
const pctFromPage = (b, page) => b.totalPages ? clamp(Math.round(page / b.totalPages * 100), 0, 100) : 0;
function setProgress(b, pct, page) {
  pct = clamp(Math.round(Number(pct) || 0), 0, 100);
  const from = b.progress || 0, today = ymd();
  const pg = typeof page === 'number' && isFinite(page) ? clamp(Math.round(page), 0, b.totalPages || page)
    : (b.totalPages ? Math.round(b.totalPages * pct / 100) : null);
  const ex = live(S.logs).find(l => l.bookId === b.id && l.date === today);
  if (pct === from) {   // 퍼센트는 같아도 쪽수만 바뀐 경우 (예: 120쪽 → 121쪽)
    if (pg === null || pg === b.page) return false;
    b.page = pg; b.lastReadAt = today;
    if (ex) { ex.toPage = pg; touch(ex); }
    touch(b); return true;
  }
  if (ex) { ex.to = pct; if (pg !== null) ex.toPage = pg; touch(ex); if (ex.to === ex.from) { ex.deleted = true; } }
  else S.logs.push(Object.assign({ id: uid(), bookId: b.id, date: today, from, to: pct, updatedAt: now() }, pg !== null ? { fromPage: b.page || 0, toPage: pg } : {}));
  if (pg !== null) b.page = pg;
  b.progress = pct; b.lastReadAt = today;
  if (pct < 100 && b.status !== 'done') delete b.prevProgress;
  if (pct >= 100 && b.status !== 'done') { if (from < 100 && typeof b.prevProgress !== 'number') b.prevProgress = from; b.status = 'done'; b.finishedAt = today; }
  else if (pct < 100 && b.status === 'done') { b.status = 'reading'; b.finishedAt = ''; }
  if (pct > 0 && b.status === 'want') { b.status = 'reading'; }
  if (pct > 0 && !b.startedAt) b.startedAt = today;
  touch(b);
  return true;
}

/* ---------- stats ---------- */
function dayAmounts() {
  const m = new Map();
  for (const l of live(S.logs)) { const d = (l.to || 0) - (l.from || 0); if (d > 0) m.set(l.date, (m.get(l.date) || 0) + d); }
  return m;
}
function streakOf(set) {
  let d = new Date(), n = 0;
  if (!set.has(ymd(d))) d = addDays(d, -1);
  while (set.has(ymd(d))) { n++; d = addDays(d, -1); }
  return n;
}
function longestStreak(dates) {
  const arr = [...dates].sort(); let best = 0, cur = 0, prev = null;
  for (const d of arr) { cur = prev && daysBetween(prev, d) === 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = d; }
  return best;
}
function etaDays(b) {
  if (b.status !== 'reading') return null;
  const logs = live(S.logs).filter(l => l.bookId === b.id && l.to > l.from).sort((a, c) => a.date.localeCompare(c.date));
  if (!logs.length) return null;
  const span = Math.max(1, daysBetween(logs[0].date, ymd()) + 1);
  const gained = (b.progress || 0) - (logs[0].from || 0);
  if (gained <= 0) return null;
  return Math.ceil((100 - (b.progress || 0)) / (gained / span));
}
function coverOf(b) { let h = 0; for (const c of b.id) h = (h * 31 + c.charCodeAt(0)) >>> 0; return 'cv' + (h % 7 + 1); }
/* 표지 주소는 https 이미지나 앱이 만든 사진(data:image)만 받아요 */
const safeCover = u => typeof u === 'string' && (/^https:\/\/[^\s"'<>]+$/i.test(u) || /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u)) ? u : '';
function coverHTML(b, size) {   // size: 'lg' | 'xs' | 없음
  const src = safeCover(b.cover);
  return `<div class="cover ${coverOf(b)}${size ? ' ' + size : ''}" aria-hidden="true"><b>${esc(b.title)}</b>${size === 'lg' && b.author ? `<small>${esc(b.author)}</small>` : ''}${src ? `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</div>`;
}
const STATUS = { want: '읽고 싶은', reading: '읽는 중', done: '완독' };
const statusLabel = s => `<span class="label ${s === 'reading' ? 'on' : s === 'done' ? 'done' : 'want'}">${STATUS[s] || ''}</span>`;
const starsText = r => r ? '★'.repeat(r) + '☆'.repeat(5 - r) : '<span class="subtle">—</span>';

/* ---------- UI state & routing ---------- */
const LS_VIEW = 'bookledger.libview';
const U = { libView: (() => { try { return localStorage.getItem(LS_VIEW) === 'gallery' ? 'gallery' : 'list'; } catch (e) { return 'list'; } })(), view: 'library', bookId: null, libFilter: 'all', libSort: 'recent', libQ: '', year: new Date().getFullYear(), qFilter: 'all', qQ: '', randomQ: null, dlg: null, quick: { mode: 'progress', bookId: null, pct: 0, text: '', src: '', tag: '' }, editId: null };
/* 화면 이동: 주소(#)가 막힌 미리보기 환경에서도 동작하도록 직접 처리 */
function curHash() { try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ''; } }
function go(h) {
  h = String(h || '').replace(/^#/, '');
  try { if (curHash() !== h) history.pushState(null, '', '#' + h); } catch (e) {}
  route(h);
}
function route(hh) {
  let h = typeof hh === 'string' ? hh : curHash();
  if (/access_token|error_description|refresh_token/.test(h)) h = '';
  let [v, id] = h.split('/');
  if (v === 'settings') v = 'sync';
  U.view = ['library', 'progress', 'quotes', 'sync', 'book'].includes(v) ? v : 'library';
  U.bookId = U.view === 'book' ? id : null;
  if (U.view === 'book' && !getBook(U.bookId)) U.view = 'library';
  render(); window.scrollTo(0, 0);
}
addEventListener('hashchange', () => route());
addEventListener('popstate', () => route());

  const g = S.settings.goal || 24, mg = S.settings.monthGoal || 15;
  // 막대는 목표가 있는 지표에만
  const stat = (k, v, unit, s, pct) => `<div class="stat"><div class="k">${k}</div><div class="v"><b class="num">${v}</b><span>${unit}</span></div>${pct == null ? '' : `<div class="bar"><i style="width:${clamp(pct, 0, 100)}%"></i></div>`}<div class="s">${s}</div></div>`;
  const reading = bs.filter(b => b.status === 'reading').sort((a, b) => (b.lastReadAt || b.updatedAt || '').localeCompare(a.lastReadAt || a.updatedAt || ''));

  const sorters = {
    recent: (a, b) => (b.lastReadAt || b.updatedAt || '').localeCompare(a.lastReadAt || a.updatedAt || ''),
    title: (a, b) => a.title.localeCompare(b.title, 'ko'),
    rating: (a, b) => (b.rating || 0) - (a.rating || 0),
    progress: (a, b) => (b.progress || 0) - (a.progress || 0)
  };
  list.sort(sorters[U.libSort] || sorters.recent);
  const qCount = id => live(S.quotes).filter(x => x.bookId === id).length;
  const seg = (v, t) => `<button data-act="libFilter" data-v="${v}" aria-pressed="${U.libFilter === v}">${t} ${cnt[v]}</button>`;
  const href = b => `#book/${encodeURIComponent(b.id)}`;

      <a class="bcard" href="${href(b)}">

          <div class="spacer"></div>

  </section>
  <section class="box">
    <div class="box-h">

      </a>`).join('')}</div>` : none) : `

      <tbody>${list.map(b => `<tr>

function vBook() {
  const b = getBook(U.bookId); if (!b) return vEmpty();
  const logs = bookLogs(b.id), qs = bookQuotes(b.id), p = b.progress || 0;
  const eta = etaDays(b);
  const unit = b.unit === 'page' ? 'page' : 'pct';
  const lastLog = logs[0];
  const delta = l => `${l.to - l.from >= 0 ? '+' : ''}${l.to - l.from}%`;
  const meta = [lastLog ? `${lastLog.date === ymd() ? '오늘' : md(lastLog.date)} ${delta(lastLog)}` : '', b.totalPages ? `p.${b.page || 0} / ${b.totalPages}` : ''].filter(Boolean).join(' · ');
  const span = b.startedAt ? (b.status === 'done' && b.finishedAt ? `${daysBetween(b.startedAt, b.finishedAt) + 1}일 걸림` : b.status === 'reading' ? `${daysBetween(b.startedAt, ymd()) + 1}일째` : '') : '';
  const sb = v => `<button data-act="status" data-v="${v}" aria-pressed="${b.status === v}">${STATUS[v]}</button>`;
  return `
  <div class="crumbs"><a href="#library">서재</a><span class="sep">/</span><b>${esc(b.title)}</b></div>
  <div class="cols">
    <div class="col">
      <div class="bhead">
        <button class="cover-btn" data-act="editBook" aria-label="표지와 책 정보 수정">${coverHTML(b, 'lg')}<span class="hint">표지 바꾸기</span></button>
        <div class="stack g2 grow">
          <h1>${esc(b.title)}</h1>

function vProgress() {
  const amounts = dayAmounts();
  const years = new Set([new Date().getFullYear(), ...[...amounts.keys()].map(d => +d.slice(0, 4))]);
  const ys = [...years].sort();
  const Y = U.year, start = new Date(Y, 0, 1), off = start.getDay();
  const nDays = (new Date(Y + 1, 0, 1) - start) / 864e5 | 0, today = ymd();
  const cells = []; for (let i = 0; i < off; i++) cells.push('<span class="pad"></span>');
  let yDays = 0; const yDates = new Set();
  for (let i = 0; i < nDays; i++) {
    const d = ymd(addDays(start, i)), a = amounts.get(d) || 0;
    if (a) { yDays++; yDates.add(d); }
    const lv = !a ? 0 : a <= 5 ? 1 : a <= 10 ? 2 : a <= 20 ? 3 : 4;
    const cls = d > today ? 'fut' : (lv ? 'l' + lv : '') + (d === today ? ' today' : '');
    cells.push(`<span class="${cls}" title="${dot(d)}${a ? ` · +${a}%` : ''}"></span>`);
  }
  const cols = Math.ceil(cells.length / 7);
  const mLabels = Array.from({ length: 12 }, (_, m) => { const di = (new Date(Y, m, 1) - start) / 864e5 | 0; return `<span style="grid-column:${Math.floor((off + di) / 7) + 1}">${m + 1}월</span>`; }).join('');

  const mg = S.settings.monthGoal || 15;
  const mDays = Array.from({ length: 12 }, (_, m) => [...yDates].filter(d => +d.slice(5, 7) === m + 1).length);
  const maxV = Math.max(mg, ...mDays) || 1, curM = Y === new Date().getFullYear() ? new Date().getMonth() : -1;
  const H = 140;
  const bs = allBooks(), g = S.settings.goal || 24;
  const doneY = bs.filter(b => b.status === 'done' && (b.finishedAt || '').startsWith(String(Y)));
  const readingN = Y === new Date().getFullYear() ? bs.filter(b => b.status === 'reading').length : 0;
  const slots = Math.max(g, doneY.length + readingN);
  const goalCells = Array.from({ length: slots }, (_, i) => `<span class="${i < doneY.length ? 'd' : i < doneY.length + readingN ? 'r' : ''}"></span>`).join('');
  const prog = bs.filter(b => b.status === 'reading' || (b.status === 'done' && (b.finishedAt || '').startsWith(String(Y))))
    .sort((a, b) => (a.status === b.status ? (b.progress || 0) - (a.progress || 0) : a.status === 'reading' ? -1 : 1));

  return `
  <div class="page-h"><h1>진척도</h1><div class="spacer"></div>
    <div class="seg" role="group" aria-label="연도">${ys.map(y => `<button data-act="year" data-v="${y}" aria-pressed="${y === Y}">${y}</button>`).join('')}</div></div>
  <section class="box">
    <div class="box-h"><h2>독서 잔디</h2><div class="spacer"></div><span class="mono t-sm muted">${yDays}일 · 최장 연속 ${longestStreak(yDates)}일</span></div>
    <div class="box-b">
      <div class="heat-wrap"><div class="heat">
        <div class="heat-days"><span></span><span>월</span><span></span><span>수</span><span></span><span>금</span><span></span></div>
        <div class="heat-col">
          <div class="heat-months" style="grid-template-columns:repeat(${cols},12px)">${mLabels}</div>
          <div class="heat-grid" role="img" aria-label="${Y}년 날짜별 독서량">${cells.join('')}</div>
        </div>
      </div></div>
      <div class="legend end"><span>적게</span><i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i><span>많이</span></div>
    </div>
  </section>
  <div class="cols">
    <section class="box col x2" style="gap:0">
      <div class="box-h"><h2>월별 독서일</h2><div class="spacer"></div>
        <a class="t-sm muted" href="#settings">목표 ${mg}일</a></div>
      <div class="box-b" style="padding-top:var(--s6)">
        <div class="mchart" style="height:${H + 32}px">
          <div class="goal" style="bottom:${Math.round(mg / maxV * H)}px"><span>${mg}일</span></div>
          ${mDays.map((v, i) => `<div class="mcol"><span>${v || ''}</span><i class="${i === curM ? 'cur' : !v ? 'zero' : v >= mg ? 'hit' : ''}" style="height:${Math.round(v / maxV * H)}px"></i></div>`).join('')}
        </div>
        <div class="mlabels">${Array.from({ length: 12 }, (_, i) => `<span>${i + 1}</span>`).join('')}</div>
      </div>
    </section>
    <section class="box col x1" style="gap:0">
      <div class="box-h"><h2>연간 목표</h2><div class="spacer"></div>
        <a class="t-sm muted" href="#settings">목표 ${g}권</a></div>
      <div class="box-b stack">
        <div class="row base"><span class="num">${doneY.length}</span><span class="mono muted">/ ${g}권</span></div>
        <div class="goalgrid">${goalCells}</div>
        <div class="legend"><i class="g d"></i><span>완독</span><span class="gap"></span><i class="g r"></i><span>읽는 중</span></div>
      </div>
    </section>
  </div>
  <section class="box">
    <div class="box-h"><h2>책별 진척</h2></div>
    ${prog.length ? prog.map(b => { const e = etaDays(b); return `<a class="prow" href="#book/${encodeURIComponent(b.id)}">
      <span class="t">${esc(b.title)}</span>${progHTML(b.progress || 0)}
      <span class="eta">${b.status === 'done' ? `${md(b.finishedAt)} 완독` : e ? `약 ${e}일 남음` : '—'}</span></a>`; }).join('')
      : `<div class="empty-row">읽는 중이거나 올해 완독한 책이 없어요.</div>`}
  </section>`;
}

function vQuotes() {
  const qs = live(S.quotes).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  if (!qs.length) return `<div class="page-h"><h1>문장</h1></div>
    <div class="empty"><h2>모은 문장이 없어요</h2><p>책 속 문장이나 떠오른 생각을 모아보세요.</p>
    <button class="btn btn-primary" data-act="newQuote">${ICON.plus}문장 추가</button></div>`;
  let hero = qs.find(q => q.id === U.randomQ);
  if (!hero) { let h = 0; for (const c of ymd()) h = (h * 33 + c.charCodeAt(0)) >>> 0; hero = qs[h % qs.length]; }
  U.heroId = hero.id;
  const srcIds = [...new Set(qs.map(q => q.bookId || '__me'))];
  const chips = [['all', '전체'], ['fav', '★ 즐겨찾기'], ...srcIds.filter(i => i !== '__me').map(i => [i, getBook(i)?.title || qs.find(q => q.bookId === i)?.bookTitle || '지운 책']), ...(srcIds.includes('__me') ? [['__me', '내 생각']] : [])];
  if (!chips.some(([v]) => v === U.qFilter)) U.qFilter = 'all';
  let list = qs;
  if (U.qFilter === 'fav') list = list.filter(q => q.fav);
  else if (U.qFilter === '__me') list = list.filter(q => !q.bookId);
  else if (U.qFilter !== 'all') list = list.filter(q => q.bookId === U.qFilter);
  const s = U.qQ.trim().toLowerCase();
  if (s) list = list.filter(q => (q.text + ' ' + quoteSrc(q) + ' ' + (q.tag || '')).toLowerCase().includes(s));
  const src = q => q.bookId && getBook(q.bookId) ? `<a href="#book/${encodeURIComponent(q.bookId)}">${esc(quoteSrc(q))}</a>` : `<b>${esc(quoteSrc(q))}</b>`;
  return `
  <div class="page-h"><h1>문장</h1><span class="counter">${qs.length}</span><div class="spacer"></div>
    <button class="btn btn-primary" data-act="newQuote">${ICON.plus}문장 추가</button></div>
  <section class="hero">
    <div class="row"><span class="k">${hero.id === U.randomQ ? '무작위 문장' : '오늘의 문장'}</span><div class="spacer"></div><button class="btn btn-sm" data-act="randomQ">${ICON.shuffle}다른 문장</button></div>
    <p>${esc(hero.text)}</p>
    <div class="src"><span>— ${esc(quoteSrc(hero))}${hero.bookId && getBook(hero.bookId)?.author ? ', ' + esc(getBook(hero.bookId).author) : ''}</span><span class="mono">${dot(ld(hero.createdAt))}</span></div>
  </section>
  <div class="qtools">
    <label class="sr" for="qQ">문장 검색</label>
    <input id="qQ" class="input" placeholder="문장·책·태그 검색" value="${esc(U.qQ)}">
    ${chips.map(([v, t]) => `<button class="chip" data-act="qFilter" data-v="${esc(v)}" aria-pressed="${U.qFilter === v}">${esc(t)}</button>`).join('')}
  </div>
  ${list.length ? `<div class="masonry">${list.map(q => `<article class="qcard">
      <p>${esc(q.text)}</p>
      <div class="src">${src(q)}<span class="mono t-xs subtle">${md(ld(q.createdAt))}</span></div>
      <div class="act">${q.tag ? `<span class="label">#${esc(q.tag)}</span>` : ''}<div class="spacer"></div>
        <button class="icon-btn" data-act="copyQuote" data-v="${q.id}" aria-label="복사">${ICON.copy}</button>
        <button class="icon-btn${q.fav ? ' on' : ''}" data-act="favQuote" data-v="${q.id}" aria-label="즐겨찾기" aria-pressed="${!!q.fav}">${ICON.star}</button>
        <button class="icon-btn" data-act="delQuote" data-v="${q.id}" aria-label="삭제">${ICON.trash}</button></div>
    </article>`).join('')}</div>` : `<p class="t-sm subtle">조건에 맞는 문장이 없어요.</p>`}`;
}

/* ---------- 표지 ---------- */
/* 예스24 상품 링크 → 표지 이미지 주소 (예: yes24.com/Product/Goods/12345 → image.yes24.com/goods/12345/XL) */
function coverFromLink(text) {
  const t = (text || '').trim();
  const y = t.match(/yes24\.com\/(?:Product\/Goods|Goods\/Detail|goods)\/(\d{4,})/i);
  if (y && !/image\.yes24\.com/i.test(t)) return { url: `https://image.yes24.com/goods/${y[1]}/XL`, from: '예스24 상품 링크' };
  const u = t.replace(/^http:\/\//i, 'https://');
  if (/(kyobobook\.co\.kr\/detail|aladin\.co\.kr\/(shop|m)\/w?product|aladin\.co\.kr\/shop\/wproduct)/i.test(u)) return { err: '상품 페이지 링크예요. 교보문고·알라딘은 표지 이미지 주소를 복사해 넣어주세요' };
  if (safeCover(u)) return { url: u };
  return { err: '이미지 주소(https://…)나 예스24 상품 링크를 넣어주세요' };
}
function renderCoverBox() {
  const box = $('#coverBox'); if (!box) return;
  const t = ($('#bTitle')?.value || '').trim(), a = ($('#bAuthor')?.value || '').trim();
  const fake = { id: U.editId || 'new', title: t || '표지', author: a, cover: U.coverDraft };
  const q = encodeURIComponent((t + ' ' + a).trim());
  const store = (name, url) => q ? `<a class="btn btn-sm" href="${url}" target="_blank" rel="noopener">${name}</a>` : `<span class="btn btn-sm" aria-disabled="true">${name}</span>`;
  box.innerHTML = `<div class="coverbox">${coverHTML(fake)}
    <div class="stack g2 grow">
      <div class="row">
        ${store('예스24', `https://www.yes24.com/product/search?domain=BOOK&query=${q}`)}
        ${store('교보문고', `https://search.kyobobook.co.kr/search?keyword=${q}`)}
        ${store('알라딘', `https://www.aladin.co.kr/search/wsearchresult.aspx?SearchTarget=Book&SearchWord=${q}`)}
      </div>
      <div class="row nowrap"><label class="sr" for="coverUrl">표지 이미지 주소 또는 예스24 상품 링크</label>
        <input id="coverUrl" class="input input-sm grow" placeholder="이미지 주소 / 예스24 링크" autocomplete="off">
        ${navigator.clipboard && navigator.clipboard.readText ? `<button class="btn btn-sm" data-act="coverPaste">붙여넣기</button>` : ''}
        <button class="btn btn-sm btn-primary" data-act="coverUrl">적용</button></div>
      <div class="row">
        <button class="btn btn-sm btn-ghost" data-act="coverPhoto">사진 올리기</button>
        ${U.coverDraft ? `<button class="btn btn-sm btn-ghost btn-danger" data-act="coverClear">표지 지우기</button>` : ''}
      </div>
      <details class="help"><summary>표지 넣는 법</summary><p>구매처에서 책을 찾아 표지 이미지를 길게 눌러 '이미지 주소 복사' 후 붙여넣으세요. 예스24는 상품 페이지 링크도 돼요.</p></details>
    </div></div>`;
}
function fileToCover(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 240 / img.width, 360 / img.height), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이미지를 읽지 못했어요')); };
    img.src = url;
  });
}

}
const ACT = {
  theme() { setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); },
  quick() { openQuick('progress'); },
  newQuote() { openQuick('quote'); },
  addBook() { U.editId = null; U.coverDraft = ''; openDlg('book'); },
  editBook() { U.editId = U.bookId; U.coverDraft = getBook(U.bookId)?.cover || ''; openDlg('book'); },

      $('#coverUrl').value = t.trim(); ACT.coverUrl();
    } catch (e) { toast('붙여넣기 권한이 없어요. 입력칸을 길게 눌러 붙여넣어 주세요'); $('#coverUrl')?.focus(); }
  },
  coverClear() { U.coverDraft = ''; renderCoverBox(); },
  coverPhoto() { $('#coverFile').click(); },

  bookSave() {
    const title = $('#bTitle').value.trim(); if (!title) { toast('제목을 입력해 주세요'); $('#bTitle').focus(); return; }
    const tags = $('#bTags').value.split(',').map(s => s.trim().replace(/^#/, '')).filter(Boolean);
    const status = $('#bStatus').value, author = $('#bAuthor').value.trim();
    const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v);
    const doneDate = isDate($('#bDone').value) ? $('#bDone').value : ymd();
    const startDate = status !== 'want' && isDate($('#bStart').value) ? $('#bStart').value : '';
    const pagesRaw = $('#bPages').value.trim(), pages = Math.round(Number(pagesRaw));
    if (pagesRaw && !(pages >= 1 && pages <= 20000)) { toast('전체 쪽수는 1~20000 사이로 넣어주세요'); $('#bPages').focus(); return; }
    let b = U.editId ? getBook(U.editId) : null;
    const isNew = !b;
    if (b) { Object.assign(b, { title, author, tags }); if (status !== b.status) applyStatus(b, status); }
    else {
      b = { id: uid(), title, author, tags, status: 'want', progress: 0, rating: 0, oneLine: '', memo: '', startedAt: '', finishedAt: '', lastReadAt: '', createdAt: now(), updatedAt: now() };
      S.books.push(b);
      // 이미 다 읽은 책을 등록할 때는 '오늘 100% 읽음' 기록을 만들지 않아요
      if (status === 'done') { b.status = 'done'; b.progress = 100; }
      else applyStatus(b, status);
    }
    if (b.status === 'done') b.finishedAt = doneDate;
    if (startDate) b.startedAt = startDate;
    if (pagesRaw) { const firstTime = !b.totalPages; b.totalPages = pages; if (b.page > pages) b.page = pages; if (b.page == null || isNew || firstTime) b.page = Math.round(pages * (b.progress || 0) / 100); if (isNew || firstTime) b.unit = 'page'; }
    else { delete b.totalPages; delete b.page; if (b.unit === 'page') b.unit = 'pct'; }
    if (U.coverDraft !== undefined) { if (U.coverDraft) b.cover = U.coverDraft; else delete b.cover; }
    else if (b.status === 'want') b.startedAt = '';
    touch(b);
    persist(); closeDlg(); U.dlgReturn = null;
    go('book/' + encodeURIComponent(b.id)); toast(isNew ? '책을 추가했어요' : '저장했어요');
  },
  async delBook() {
    const b = getBook(U.editId || U.bookId); if (!b) return;

    closeDlg();
    b.deleted = true; touch(b);
    for (const l of S.logs) if (l.bookId === b.id && !l.deleted) { l.deleted = true; touch(l); }
    persist(); go('library'); toast('삭제했어요');
  },
  status(v) { const b = getBook(U.bookId); applyStatus(b, v); touch(b); persist(); render(); },
  setPct() { const b = getBook(U.bookId); if (setProgress(b, $('#pctIn').value)) { persist(); render(); toast(b.progress >= 100 ? '완독을 축하해요!' : '기록했어요'); } },
  addPct(v) { const b = getBook(U.bookId); const to = v === '100' ? 100 : (b.progress || 0) + Number(v); if (setProgress(b, to)) { persist(); render(); toast(b.progress >= 100 ? '완독을 축하해요!' : '기록했어요'); } },
  unit(v) { const b = getBook(U.bookId); b.unit = v; touch(b); persist(); render(); setTimeout(() => (v === 'page' ? ($('#totalIn') || $('#pageIn')) : $('#pctIn'))?.focus(), 0); },
  setPage() {
    const b = getBook(U.bookId);
    if (!b.totalPages) {
      const t = Math.round(Number($('#totalIn')?.value));
      if (!(t >= 1 && t <= 20000)) { toast('먼저 전체 쪽수를 넣어주세요'); $('#totalIn')?.focus(); return; }
      b.totalPages = t; b.page = Math.round(t * (b.progress || 0) / 100); touch(b);
    }
    const raw = $('#pageIn').value.trim();
    if (raw === '') { toast('읽은 쪽수를 넣어주세요'); $('#pageIn').focus(); return; }
    let pg = Math.round(Number(raw));
    if (!(pg >= 0)) { toast('쪽수를 확인해 주세요'); return; }
    if (pg > b.totalPages) { pg = b.totalPages; toast(`전체 ${b.totalPages}쪽보다 커서 마지막 쪽으로 기록했어요`); }
    if (setProgress(b, pctFromPage(b, pg), pg)) { persist(); render(); if (pg !== Math.round(Number(raw))) return; toast(b.progress >= 100 ? '완독을 축하해요!' : `p.${pg} · ${b.progress}% 기록했어요`); }
    else { persist(); render(); }
  },

function applyStatus(b, s) {
  const today = ymd();
  if (s === b.status) return;
  if (s === 'done') {
    if ((b.progress || 0) < 100) { b.prevProgress = b.progress || 0; setProgress(b, 100); }
    b.status = 'done'; b.finishedAt = b.finishedAt || today;
    return;
  }
  if (b.status === 'done') {
    let back = typeof b.prevProgress === 'number' ? b.prevProgress : null;
    if (back === null) {   // 예전 데이터: 100%에 도달한 기록의 시작점으로
      const fin = live(S.logs).filter(l => l.bookId === b.id && l.to >= 100).sort((x, y) => y.date.localeCompare(x.date))[0];
      if (fin) back = fin.from;
    }
    if (back !== null && back < 100) setProgress(b, back);   // 오늘 생긴 100% 기록도 함께 되돌려요
    else if ((b.progress || 0) >= 100) b.progress = 0;
    delete b.prevProgress;
    b.finishedAt = '';
  }
  b.status = s;
  if (s === 'reading' && !b.startedAt) b.startedAt = today;
}

      if (r.error) throw r.error;
      if (r.data && r.data.data) S = merge3(S, normalize(r.data.data), loadBase(), conflicts);
      try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
      const payload = JSON.parse(JSON.stringify(S));
      if (r.data) {
        // 내가 읽은 뒤 다른 기기가 먼저 저장했다면(rev가 달라졌다면) 다시 읽어서 합쳐요
        const rev = Number(r.data.rev) || 0;
        const w = await sb.from('ledger').update({ data: payload, rev: rev + 1, updated_at: now() }).eq('user_id', sbUser.id).eq('rev', rev).select('rev');
        if (w.error) throw w.error;
        saved = !!(w.data && w.data.length);
      } else {
        const w = await sb.from('ledger').insert({ user_id: sbUser.id, data: payload, rev: 1 });
        if (w.error && w.error.code !== '23505') throw w.error;
        saved = !w.error;
      }
      if (saved) saveBase(payload);
      else await new Promise(res => setTimeout(res, 150 + Math.random() * 350));
    }
    if (!saved) throw new Error('다른 기기와 동시에 저장하고 있어요. 잠시 뒤 다시 시도할게요.');
    setSync('ok');
    if (JSON.stringify(S) !== before || U.view === 'sync') render();
    if (conflicts.length) toast(`두 기기에서 같은 글을 고쳐서 둘 다 남겨뒀어요 (${[...new Set(conflicts)].filter(Boolean).slice(0, 2).join(', ')})`);
    else if (manual === true) toast('동기화했어요');
  } catch (e) {
    const msg = e.message || String(e);
    setSync('error', /relation|does not exist|schema cache|column/i.test(msg) ? 'ledger 표가 없거나 예전 구조예요. 동기화 탭의 SQL을 Supabase에서 실행해 주세요.' : msg);
    if (/동시에 저장/.test(msg)) setTimeout(syncNow, 3000);
    if (U.view === 'sync') render();
  } finally {
    syncing = false;
    if (again) { again = false; setTimeout(syncNow, 400); }
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });

/* ---------- 예시 데이터 ---------- */
function seed() {
  const today = new Date(), Y = today.getFullYear();
  const day = n => ymd(addDays(today, -n));
  let r = 7; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  const mk = (title, author, tags, status, extra) => {
    const b = Object.assign({ id: uid(), title, author, tags, status, progress: 0, rating: 0, oneLine: '', memo: '', startedAt: '', finishedAt: '', lastReadAt: '', createdAt: now(), updatedAt: now(), sample: true }, extra);
    S.books.push(b); return b;
  };
  const logRun = (b, startDaysAgo, target, endDaysAgo = 0) => {
    let p = 0, d = startDaysAgo; b.startedAt = day(startDaysAgo);
    while (d >= endDaysAgo && p < target) {
      if (rnd() < 0.62) { const avg = target / ((startDaysAgo - endDaysAgo + 1) * 0.62); const step = Math.min(target - p, Math.max(1, Math.round(avg * (0.5 + rnd())))); S.logs.push({ id: uid(), bookId: b.id, date: day(d), from: p, to: p + step, updatedAt: now(), sample: true }); p += step; b.lastReadAt = day(d); }
      d--;
    }
    if (p < target) { S.logs.push({ id: uid(), bookId: b.id, date: day(endDaysAgo), from: p, to: target, updatedAt: now(), sample: true }); p = target; b.lastReadAt = day(endDaysAgo); }
    b.progress = p; if (p >= 100) b.finishedAt = b.lastReadAt;
  };
  const doy = Math.floor((today - new Date(Y, 0, 1)) / 864e5);
  const span = Math.max(40, doy);
  const demian = mk('데미안', '헤르만 헤세', ['소설', '고전'], 'done', { rating: 5, oneLine: '나를 찾는다는 말이 처음 와닿았다.', memo: '싱클레어가 자기 안의 목소리를 따라가는 이야기. 다시 읽으면 또 다르게 읽힐 것 같다.' });
  logRun(demian, Math.min(span, 200), 100, Math.min(span - 1, 170));
  const kafka = mk('변신', '프란츠 카프카', ['소설'], 'done', { rating: 4, oneLine: '짧은데 오래 남는다.' });
  logRun(kafka, Math.min(span, 120), 100, Math.min(span - 1, 112));
  const frank = mk('프랑켄슈타인', '메리 셸리', ['소설', '고전'], 'done', { rating: 4, oneLine: '괴물보다 만든 사람이 더 무섭다.' });
  logRun(frank, Math.min(span, 90), 100, Math.min(span - 1, 60));
  const walden = mk('월든', '헨리 데이비드 소로', ['에세이', '자연'], 'reading', { oneLine: '단순하게 사는 법에 대한 긴 일기 같다.', memo: '호수를 묘사하는 부분부터 문장이 살아난다.\n가진 게 적을수록 시간이 많아진다는 계산이 인상적이었다.' });
  logRun(walden, 30, 62, 1);
  const med = mk('명상록', '마르쿠스 아우렐리우스', ['철학'], 'reading', { oneLine: '아침마다 한 장씩.' });
  logRun(med, 45, 35, 3);
  const pride = mk('오만과 편견', '제인 오스틴', ['소설'], 'reading', {});
  logRun(pride, 4, 12, 0);
  mk('위대한 개츠비', 'F. 스콧 피츠제럴드', ['소설'], 'want', {});
  const q = (text, b, tag, daysAgo, fav) => S.quotes.push({ id: uid(), text, bookId: b ? b.id : null, bookTitle: b ? b.title : '', tag, fav: !!fav, createdAt: addDays(today, -daysAgo).toISOString(), updatedAt: now(), sample: true });
  q('새는 알에서 나오려고 투쟁한다. 알은 하나의 세계다. 태어나려는 자는 하나의 세계를 깨뜨려야 한다.', demian, '나', 180, true);
  q('나는 내 속에서 스스로 솟아나려는 것, 바로 그것을 살아보려 했을 뿐이다.', demian, '나', 185);
  q('어느 날 아침 그레고르 잠자가 불안한 꿈에서 깨어났을 때, 그는 자신이 침대 속에서 흉측한 벌레로 변해 있는 것을 발견했다.', kafka, '첫문장', 118);
  q('나는 신중하게 살고 싶어서 숲으로 갔다. 삶의 본질만을 마주하고 싶었다.', walden, '삶', 2, true);
  q('우리의 삶은 사소한 일들로 낭비되고 있다. 단순하게, 단순하게.', walden, '단순함', 9);
  q('지금 하는 일을 생애 마지막 일인 것처럼 하라.', med, '태도', 4);
  q('외부의 일이 너를 괴롭히는 것이 아니라, 그 일에 대한 너의 판단이 너를 괴롭힌다.', med, '마음', 3);
  q('퇴근길 지하철에서, 오늘 하루를 한 문장으로 줄이면 무엇일지 생각했다.', null, '메모', 6);
}
